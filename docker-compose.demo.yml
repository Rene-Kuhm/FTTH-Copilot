# FTTH-Copilot — Demo Docker Compose
# One-command demo environment with synthetic FTTH data and demo account.
#
# Usage:
#   cp .env.demo .env
#   docker compose -f docker-compose.demo.yml up
#
# Or with the convenience wrapper:
#   ./scripts/run-demo.sh
#
# What it starts:
#   1. postgres  — persistent volume, survives restarts
#   2. db-migrate — runs Prisma migrations, exits
#   3. app      — Next.js on :3001 with DEMO_MODE_ENABLED=true
#   4. db-seed  — seeds demo account + synthetic ONUs/alerts, exits
#
# Demo credentials:
#   URL:     http://localhost:3001
#   Email:   admin@ftth-copilot.local
#   Password: demo12345  (set by SEED_ADMIN_PASSWORD=demo12345)

services:
  postgres:
    image: postgres:16-alpine
    container_name: ftth_demo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ftth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ftth_copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ftth} -d ${POSTGRES_DB:-ftth_copilot}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - ftth-demo

  # ─────────────────────────────────────────────────────────────────────────
  # Redis — durable job queue for the background worker.
  #
  # Self-hosted: no managed broker. Append-only persistence is on because
  # the queue holds the ingest backlog, and a job that was accepted but not
  # yet drained must survive a Redis restart.
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:8.10.2-alpine
    container_name: ftth_demo_redis
    restart: unless-stopped
    environment:
      # The healthcheck authenticates with it.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # A published port does not go through the host firewall, so Redis
      # never listens without a password.
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_demo_data:/data
    healthcheck:
      # It authenticates: a bare `redis-cli ping` gets NOAUTH and still
      # exits 0, so it would report a healthy Redis that nobody can use.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ftth-demo

  # ─────────────────────────────────────────────────────────────────────────
  # Worker — background job runner (backend extraction).
  #
  # Behind a profile on purpose: while BACKEND_MODE=embedded (the default)
  # the web still runs the loops, and running both would poll the NMS twice.
  #   docker compose -f docker-compose.demo.yml --profile worker up
  #
  # It uses the host network so the syslog receiver sees the real source IP
  # of every datagram: Docker's userland proxy for UDP would rewrite it to
  # the bridge gateway and merge every OLT into a single source.
  # ─────────────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: ftth_demo_worker
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # The worker runs on the host network, so it reaches Redis and Postgres
      # through the ports the host publishes — not by service name, which
      # only resolves inside the compose network.
      REDIS_URL: "redis://:${REDIS_PASSWORD}@127.0.0.1:${REDIS_PORT:-6379}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ftth}:${POSTGRES_PASSWORD:-change-me}@127.0.0.1:${POSTGRES_PORT:-5432}/ftth_copilot"
      EVENT_SPOOL_DIR: /var/lib/ftth-copilot/spool/worker
      # The health server stays on the loopback by default. Set
      # WORKER_HOST=0.0.0.0 (or a private interface) together with
      # VICTORIAMETRICS_WORKER_SCRAPE_TARGET to let VictoriaMetrics scrape
      # the worker: with the host network, the container reaches the host
      # by address and not by 127.0.0.1. See docs/worker.md.
      WORKER_HOST: ${WORKER_HOST:-127.0.0.1}
    volumes:
      - spool_demo_data:/var/lib/ftth-copilot/spool
    depends_on:
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    profiles:
      - worker

  # ─────────────────────────────────────────────────────────────────────────
  # PgBouncer — connection pooling between app and postgres.
  #
  # The service is NOT part of this compose anymore. The app connects
  # directly to postgres (see the DATABASE_URL below): the demo does not need
  # pooling at its traffic levels, and keeping the service here stopped the
  # whole demo from starting — its image was gone from Docker Hub, and the
  # `depends_on` made the app wait for a pooler it never talked to.
  #
  # `docker/pgbouncer.ini` stays in the repo for whoever wants to run
  # PgBouncer in front of postgres on their own.
  # ─────────────────────────────────────────────────────────────────────────

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dependencies
    container_name: ftth_demo_migrate
    restart: "no"
    command: ["pnpm", "--filter", "@ftth-copilot/db", "db:deploy"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ftth-demo

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      # Needed so the Edge middleware can verify sessions. Edge inlines
      # process.env at build time; without this the bundle ships without the
      # secret and every protected route redirects to /login.
      args:
        JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    container_name: ftth_demo_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3001
      # The durable queue. Redis is published on the loopback only and
      # requires a password; see the redis service below.
      REDIS_URL: "redis://:${REDIS_PASSWORD}@127.0.0.1:${REDIS_PORT:-6379}"
      # The web owns the `web` subdirectory of the spool volume: the worker
      # owns `worker`, and two processes must never write the same spool.
      EVENT_SPOOL_DIR: /var/lib/ftth-copilot/spool/web
      DEMO_MODE_ENABLED: "true"
      VICTORIAMETRICS_URL: ${VICTORIAMETRICS_URL:-http://victoriametrics:8428}
      # Connect directly to postgres.
      #
      # This used to route through PgBouncer, but the pooler is not part of
      # this compose anymore (see the note above the removed service) and
      # pooling is not needed at demo traffic levels.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ftth}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/ftth_copilot"
      # Laya URL is required when LAYA_ENABLED=true and the HTTP service is
      # used. Module-import mode (the expert classifier) does not need it.
      # Docker DNS resolves 'laya' to the laya container on the same network.
      LAYA_URL: ${LAYA_URL:-http://laya:8080}
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - ftth-demo

  # ─────────────────────────────────────────────────────────────────────
  # VictoriaMetrics — Time-series database + Dashboard UI
  # Drop-in replacement for Prometheus with better compression,
  # long-term retention, and built-in Grafana-compatible UI.
  #
  # Access: http://localhost:8428 (VM UI + Prometheus-compatible API)
  # Docs: https://docs.victoriametrics.com/
  # ─────────────────────────────────────────────────────────────────────
  victoriametrics:
    image: ${VICTORIAMETRICS_IMAGE:-victoriametrics/victoria-metrics:v1.153.0}
    container_name: ftth_demo_victoriametrics
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/vm/entrypoint.sh"]
    environment:
      # Single-node VictoriaMetrics takes a Prometheus scrape config via
      # -promscrape.config. The wrapper renders the two variable fields.
      VICTORIAMETRICS_SCRAPE_TARGET: ${VICTORIAMETRICS_SCRAPE_TARGET:-app:3001}
      # The worker scrape is a second job of the SAME scrape configuration
      # (the single-node binary reads a single file), and it is only added
      # when this is set. Empty by default: the worker runs behind a
      # profile, so a target that is always there would be a target that is
      # always down. See docs/worker.md for the recipe.
      VICTORIAMETRICS_WORKER_SCRAPE_TARGET: ${VICTORIAMETRICS_WORKER_SCRAPE_TARGET:-}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      DEPLOY_ENV: ${DEPLOY_ENV:-development}
      VM_RETENTION_PERIOD: ${VICTORIAMETRICS_RETENTION:-1}
      VM_LOG_LEVEL: ${VICTORIAMETRICS_LOG_LEVEL:-INFO}
    ports:
      - "${VICTORIAMETRICS_PORT:-8428}:8428"
    volumes:
      - victoriametrics_demo_data:/storage
      - ./docker/victoriametrics-entrypoint.sh:/opt/vm/entrypoint.sh:ro
      - ./docker/victoriametrics-scrape.yml:/etc/victoriametrics/scrape.yml.tmpl:ro
      - ./docker/victoriametrics-scrape-worker.yml:/etc/victoriametrics/scrape-worker.yml.tmpl:ro
    healthcheck:
      # 127.0.0.1, not localhost: inside this image localhost resolves to ::1
      # first and VictoriaMetrics listens on IPv4 only, so localhost refuses.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      app:
        condition: service_started
    extra_hosts:
      # Allows scraping a dev server running on the host (Linux).
      - 'host.docker.internal:host-gateway'
    networks:
      - ftth-demo

  # ─────────────────────────────────────────────────────────────────────
  # vmalert — recording + alerting rules.
  # Single-node VictoriaMetrics does not evaluate PromQL rules, so this runs as
  # a sidecar against the VM query API and writes recorded series back over
  # remote write. Opt in with:  --profile alerts
  # ─────────────────────────────────────────────────────────────────────
  vmalert:
    image: ${VMALERT_IMAGE:-victoriametrics/vmalert:v1.153.0}
    container_name: ftth_demo_vmalert
    restart: unless-stopped
    entrypoint: ["/vmalert-prod"]
    command:
      - '-rule=/etc/vmalert/rules.yml'
      - '-datasource.url=http://victoriametrics:8428'
      # Single-node appends /api/v1/write itself; do NOT include the path here.
      - '-remoteWrite.url=http://victoriametrics:8428'
      - '-notifier.url=http://victoriametrics:8428'
      - '-loggerLevel=${VMALERT_LOG_LEVEL:-INFO}'
    volumes:
      - ./docker/victoriametrics-alerts.yml:/etc/vmalert/rules.yml:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
    profiles:
      - alerts
    networks:
      - ftth-demo


  # ─────────────────────────────────────────────────────────────────────
  # ntfy — free self-hosted push notifications (web, Android, iOS, Linux).
  # Alternative to Firebase Cloud Messaging (FCM) without vendor lock-in.
  # Default: https://ntfy.sh (public, no account needed).
  # For self-hosted: docker run -p 8125:80 binwiederhier/ntfy
  # ─────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────
  # Laya Decision Layer — Fast Decision System (ADR-042)
  # Expert System (94.4% accuracy) — no GPU required.
  # Opt-in: docker compose --profile laya
  # ─────────────────────────────────────────────────────────────────────
  laya:
    build:
      context: ./services/laya
      dockerfile: Dockerfile
    container_name: ftth_demo_laya
    restart: unless-stopped
    environment:
      LAYA_MODE: ${LAYA_MODE:-shadow}
      LAYA_LOG_LEVEL: ${LAYA_LOG_LEVEL:-info}
    ports:
      - "${LAYA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    profiles:
      - laya
    networks:
      - ftth-demo

  ntfy:
    image: binwiederhier/ntfy:v2.36.0
    container_name: ftth_demo_ntfy
    restart: unless-stopped
    ports:
      - "${NTFY_PORT:-8125}:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy
    environment:
      - NTFY_CACHE_DURATION=1h
      - NTFY_AUTH_STATIC=none
    # The image's default command prints the help and exits: the server runs
    # under the `serve` subcommand.
    command: ["serve"]
    networks:
      - ftth-demo

  # Seeds demo account + synthetic ONU metrics and alerts.
  # Runs after app is reachable so the UI can show immediately.
  db-seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: dependencies
    container_name: ftth_demo_seed
    restart: "no"
    command: ["pnpm", "--filter", "@ftth-copilot/db", "db:seed"]
    env_file:
      - .env
    environment:
      NODE_ENV: development
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-demo12345}
      ALLOW_PRODUCTION_SEED: "true"
      DEMO_DATA_ENABLED: "true"
    depends_on:
      app:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    networks:
      - ftth-demo

volumes:
  postgres_demo_data:
  redis_demo_data:
  spool_demo_data:
  victoriametrics_demo_data:
  ntfy_cache:

networks:
  ftth-demo:
    driver: bridge

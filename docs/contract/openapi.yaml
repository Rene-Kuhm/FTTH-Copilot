openapi: 3.1.0

info:
  title: FTTH-Copilot — API HTTP
  version: 0.2.2
  summary: Contrato de la API HTTP de FTTH-Copilot.
  description: |
    Este documento es la **fuente única de verdad** de la API HTTP del repo. De acá se
    generan la referencia publicada en `docs/reference/api-http.md`, los tipos TypeScript
    y los esquemas Zod de `@ftth-copilot/api-contract`. Si el código y este contrato no
    coinciden, el CI falla: no hay una segunda fuente que pueda desactualizarse en
    silencio.

    Los nombres de rutas, parámetros y propiedades son los del código
    (`apps/web/app/api/**\/route.ts`); las descripciones están en español porque
    alimentan la referencia, que es documentación.

    ### Pipeline global de requests

    `apps/web/middleware.ts` clasifica `/api/*` como `api` (`middleware.ts:94`): **el
    middleware nunca aplica auth a las rutas de API**. Sólo aplica CSRF y rate limit;
    la autorización vive dentro de cada handler.

    | Paso | Comportamiento | Dónde |
    |---|---|---|
    | Health | `/api/health` sale antes de todo: sin rate limit, sin CSRF, sin headers de seguridad | `middleware.ts:121` |
    | CSRF | `POST/PUT/DELETE/PATCH` exige header `X-CSRF-Token` igual a la cookie `ftth_csrf`. Sin match ⇒ **403** `{error:'Invalid CSRF token'}`. Exento: `/api/auth/*` | `middleware.ts:127` |
    | Rate limit | `/api/auth/*` ⇒ 200 req/60 s; el resto ⇒ 100 req/60 s. Clave `tenant:<tenantId>` del JWT o `ip:<x-forwarded-for>` | `middleware.ts:146` |
    | Límite excedido | **429** `{error:'Too many requests', retryAfter}` + `retry-after` y `x-ratelimit-reset` | `middleware/rate-limit.ts:128` |
    | Headers de éxito | `x-ratelimit-remaining`, `x-ratelimit-reset` | `middleware.ts:168` |
    | Seguridad | `nosniff`, `DENY` frame, `referrer-policy`, CSP, HSTS en producción | `middleware.ts:243` |

    ### CSRF en detalle

    Cookie `ftth_csrf`: 32 bytes aleatorios en hex, `Path=/; SameSite=Strict;
    Max-Age=86400` (`apps/web/lib/auth/csrf.ts:21`, `:106`). **No es `HttpOnly`** a
    propósito: el token no es una credencial, tiene que ser legible por JS para que el
    cliente lo reenvíe. La cookie de sesión `ftth_session`, en cambio, sí es
    `HttpOnly`.

    Validación: comparación en tiempo constante entre cookie y header (`csrf.ts:55`). El
    cliente `csrfFetch()` (`apps/web/lib/auth/csrf-client.ts:16`) adjunta el header sólo
    en métodos mutantes y **lanza** si la cookie no está.

    ### Roles y permisos

    `apps/web/lib/auth/permissions.ts:14-88`. Roles: `OWNER`, `ADMIN`, `OPERATOR`,
    `MEMBER` (donde `MEMBER` ≡ `OPERATOR`).

    | Rol | Permisos |
    |---|---|
    | `OWNER` | Los 11 |
    | `ADMIN` | Todos salvo `execute_actions` |
    | `OPERATOR` / `MEMBER` | `chat`, `view_own_conversations`, `delete_conversations`, `view_network`, `ack_alerts`, `manage_incidents` |

    La sesión se resuelve con `getCurrentUser()` (`apps/web/lib/auth/server.ts:409`):
    verifica el JWT **y** que exista la fila `prisma.session` vigente.
  license:
    name: Propietaria
  contact:
    name: Equipo FTTH-Copilot
    url: https://github.com/Rene-Kuhm/FTTH-Copilot

servers:
  - url: http://localhost:3001
    description: Desarrollo local (`pnpm dev`).
  - url: https://{host}
    description: Instalación propia del operador.
    variables:
      host:
        default: ftth-copilot.local
        description: Host donde se despliega la plataforma.

security:
  - sessionCookie: []

tags:
  - name: Salud y métricas
    description: Liveness, métricas Prometheus y proxy a VictoriaMetrics.
  - name: Autenticación
    description: Login, signup, sesión y MFA.
  - name: Chat y conversaciones
    description: Copiloto conversacional y su historial.
  - name: Conectores NMS
    description: Alta, prueba y baja de conexiones a SmartOLT, Mikrowisp y MikroTik.
  - name: Red
    description: Dashboard, alertas, SLA, auditoría, seguridad y topología.
  - name: Incidentes e investigaciones
    description: Incidentes, correlación y el motor de investigación.
  - name: Planes de fibra
    description: Planos de fibra con zonas y marcadores.
  - name: Mantenimiento y on-call
    description: Ventanas de mantenimiento, guardias y canales de notificación.
  - name: Ops
    description: Timeline, situaciones, anomalías, capacidad, runbooks y stream.
  - name: Usuarios
    description: Administración de usuarios y roles.

paths:
  /api/health:
    get:
      tags: [Salud y métricas]
      summary: Liveness del proceso y de sus servicios.
      description: |
        Sale antes de todo el pipeline del middleware: sin rate limit, sin CSRF y sin
        headers de seguridad. Responde **503** cuando el proceso está degradado.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: El proceso está sano.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '503':
          description: El proceso está degradado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'

  /api/metrics:
    get:
      tags: [Salud y métricas]
      summary: Exposición de métricas Prometheus.
      description: |
        Devuelve la familia `ftth_copilot_*` y `ftth_laya_*` en texto plano
        (`text/plain; version=0.0.4`). Si `METRICS_BEARER_TOKEN` está seteado, exige el
        Bearer correspondiente.
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: Métricas en formato de exposición Prometheus.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Falta o no coincide el `METRICS_BEARER_TOKEN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/vm/query:
    get:
      tags: [Salud y métricas]
      summary: Proxy a VictoriaMetrics (`query_range`).
      operationId: queryVictoriaMetricsRange
      security: []
      parameters:
        - name: query
          in: query
          required: true
          description: Expresión PromQL.
          schema:
            type: string
      responses:
        '200':
          description: Respuesta cruda de VictoriaMetrics.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Falta el parámetro `query`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: VictoriaMetrics no respondió.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'

  /api/vm/instant:
    get:
      tags: [Salud y métricas]
      summary: Proxy a VictoriaMetrics (`query`, valor puntual).
      operationId: queryVictoriaMetricsInstant
      security: []
      parameters:
        - name: query
          in: query
          required: true
          description: Expresión PromQL.
          schema:
            type: string
      responses:
        '200':
          description: Respuesta cruda de VictoriaMetrics.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Falta el parámetro `query`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: VictoriaMetrics no respondió.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'

  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Inicia sesión con email y contraseña.
      description: |
        Cuota propia por email **e** IP. Si el usuario tiene MFA activo responde
        `200 {mfaRequired:true,tempToken}` en lugar de emitir la cookie de sesión.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaRequiredResponse'
        '400':
          description: JSON inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Cuota de intentos excedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedError'

  /api/auth/signup:
    post:
      tags: [Autenticación]
      summary: Registra un usuario nuevo y su tenant.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          description: JSON inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El email ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Cuota por IP excedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedError'

  /api/auth/me:
    get:
      tags: [Autenticación]
      summary: Devuelve la sesión actual.
      description: |
        Degrada a `200 {user:null}` cuando no hay sesión válida: no es un error.
      operationId: getCurrentSession
      responses:
        '200':
          description: Estado de la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'

  /api/auth/logout:
    post:
      tags: [Autenticación]
      summary: Cierra la sesión y expira las cookies.
      operationId: logout
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /api/auth/{...nextauth}:
    get:
      tags: [Autenticación]
      summary: Stub de NextAuth (no implementado).
      description: |
        Placeholder del route handler de NextAuth. **No** está implementado: responde
        **501** siempre.
      operationId: nextAuthStub
      security: []
      responses:
        '501':
          description: NextAuth no está configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Autenticación]
      summary: Stub de NextAuth (no implementado).
      description: Placeholder del route handler de NextAuth. Responde **501** siempre.
      operationId: nextAuthStubPost
      security: []
      responses:
        '501':
          description: NextAuth no está configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/ldap-test:
    get:
      tags: [Autenticación]
      summary: Diagnostica la conexión LDAP del tenant.
      operationId: testLdap
      x-roles: [OWNER, ADMIN]
      responses:
        '200':
          description: Resultado del diagnóstico.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El rol no es `OWNER` ni `ADMIN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/mfa/setup:
    get:
      tags: [Autenticación]
      summary: Estado de MFA del usuario actual.
      operationId: getMfaSetupStatus
      responses:
        '200':
          description: Estado de MFA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnabledResponse'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Autenticación]
      summary: Genera el secreto TOTP y la URI `otpauth`.
      operationId: setupMfa
      responses:
        '200':
          description: Secreto y URI para enrolar el autenticador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: MFA ya está activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Autenticación]
      summary: Desactiva MFA (exige un código TOTP vigente).
      operationId: disableMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpRequest'
      responses:
        '200':
          description: MFA desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnabledResponse'
        '400':
          description: Código inválido o ausente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/mfa/disable:
    post:
      tags: [Autenticación]
      summary: Desactiva MFA (exige un código TOTP vigente).
      operationId: disableMfaByCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpRequest'
      responses:
        '200':
          description: MFA desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Código inválido o ausente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/mfa/verify:
    post:
      tags: [Autenticación]
      summary: Verifica el segundo factor y abre sesión.
      description: |
        Acepta `{email,password,code}`, `{code}` o `{tempToken,code}`. Es la única
        operación de auth que **no** exige CSRF y la única que emite sólo la cookie de
        sesión (no la de CSRF).
      operationId: verifyMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Segundo_factor verificado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Cuerpo inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial, código o token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/chat:
    post:
      tags: [Chat y conversaciones]
      summary: Corre el agente y persiste la conversación.
      description: |
        Persiste conversación, mensajes, tool calls, `verdict_log` y un candidato de
        incidente pendiente. Requiere el permiso `chat`.
      operationId: postChat
      x-permission: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Diagnóstico del agente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Cuerpo inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `chat`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La conversación o la conexión no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto de estado en la conversación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Cuota de chat o de investigación excedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedError'

  /api/conversations:
    get:
      tags: [Chat y conversaciones]
      summary: Lista las conversaciones del usuario.
      description: |
        Sin sesión válida degrada a una lista vacía en lugar de responder 401.
      operationId: listConversations
      parameters:
        - name: q
          in: query
          required: false
          description: Filtra por título.
          schema:
            type: string
      responses:
        '200':
          description: Conversaciones del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'

  /api/conversations/{id}:
    get:
      tags: [Chat y conversaciones]
      summary: Devuelve una conversación con sus mensajes.
      description: |
        El alcance lo decide el permiso `view_all_conversations`: sin él, sólo se ven
        las conversaciones propias.
      operationId: getConversation
      x-permission: view_all_conversations
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Conversación y mensajes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe o no es visible para el usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/conversations/{id}/export:
    get:
      tags: [Chat y conversaciones]
      summary: Exporta una conversación.
      description: |
        Con `?format=text` devuelve un attachment `text/plain`; por defecto devuelve
        JSON con los mensajes.
      operationId: exportConversation
      x-permission: view_all_conversations
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: format
          in: query
          required: false
          description: Formato de la exportación.
          schema:
            type: string
            enum: [json, text]
            default: json
      responses:
        '200':
          description: Conversación exportada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
            text/plain:
              schema:
                type: string
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe o no es visible para el usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/connectors:
    get:
      tags: [Conectores NMS]
      summary: Lista los conectores NMS del tenant.
      description: |
        **Nunca** expone la API key del conector. Sin sesión válida degrada a
        `{connectors:[]}`.
      operationId: listConnectors
      responses:
        '200':
          description: Conectores del tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorList'

  /api/connectors/create:
    post:
      tags: [Conectores NMS]
      summary: Crea una conexión a un NMS.
      description: |
        Valida la URL con `assertSafeNmsBaseUrl` (política SSRF de
        `connectors-core`). Un proveedor no implementado responde **422**.
      operationId: createConnector
      x-permission: manage_connectors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectorRequest'
      responses:
        '201':
          description: Conector creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connector:
                    $ref: '#/components/schemas/Connector'
                required: [connector]
        '400':
          description: Cuerpo inválido o URL no segura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_connectors`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: El proveedor todavía no está implementado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/connectors/{id}:
    delete:
      tags: [Conectores NMS]
      summary: Borra un conector.
      description: |
        La misma respuesta (`404 {error:'Not found or not authorized'}`) para un
        conector inexistente y para uno que no es del usuario: no filtra existencia.
      operationId: deleteConnector
      x-permission: manage_connectors
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Conector borrado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_connectors`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe o no está autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/connectors/{id}/test:
    post:
      tags: [Conectores NMS]
      summary: Prueba la conectividad con el NMS.
      operationId: testConnector
      x-permission: manage_connectors
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: La conexión respondió.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorTestResponse'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_connectors`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: El NMS no respondió.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorTestResponse'

  /api/dashboard:
    get:
      tags: [Red]
      summary: Estado agregado de la red.
      description: Requiere el permiso `view_network`.
      operationId: getDashboard
      x-permission: view_network
      parameters:
        - name: connectionId
          in: query
          required: false
          description: Acota el dashboard a una conexión.
          schema:
            type: string
      responses:
        '200':
          description: Resumen de la red.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `view_network`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/alerts:
    get:
      tags: [Red]
      summary: Alertas detectadas.
      description: Requiere el permiso `view_network`.

  /api/maintenance-windows:
    get:
      tags: [Mantenimiento y on-call]
      summary: Lista las ventanas de mantenimiento.
      description: |
        Exige sesión, pero **no** exige permiso: es la única operación de la sección
        que no chequea `manage_maintenance`.
      operationId: listMaintenanceWindows
      parameters:
        - name: from
          in: query
          required: false
          description: Límite inferior (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Límite superior (ISO 8601).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Ventanas de la ventana pedida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  windows:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceWindow'
                required: [windows]
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Mantenimiento y on-call]
      summary: Abre una ventana de mantenimiento.
      description: |
        Requiere el permiso `manage_maintenance`. Si la ventana se solapa con otra
        responde **409** con `{error:'overlap',overlappingWindowId,...}`.
      operationId: createMaintenanceWindow
      x-permission: manage_maintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaintenanceWindowRequest'
      responses:
        '201':
          description: Ventana creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  window:
                    $ref: '#/components/schemas/MaintenanceWindow'
                required: [window]
        '400':
          description: Cuerpo inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_maintenance`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La ventana se solapa con otra existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceOverlapError'

  /api/maintenance-windows/{id}:
    delete:
      tags: [Mantenimiento y on-call]
      summary: Cancela una ventana de mantenimiento.
      description: |
        Cancelación blanda: la fila queda con `status='cancelled'`. Si la ventana ya
        está terminal responde **409** con `{error:'already_terminal',currentStatus}`.
      operationId: cancelMaintenanceWindow
      x-permission: manage_maintenance
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelMaintenanceWindowRequest'
      responses:
        '200':
          description: Ventana cancelada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Cuerpo inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_maintenance`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La ventana ya está en estado terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlreadyTerminalError'


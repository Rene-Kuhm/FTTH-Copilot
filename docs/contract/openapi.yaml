              schema:
                type: string
        '403':
          description: Sin permiso `view_network`.
          content:
            text/plain:
              schema:
                type: string

  /api/users:
    get:
      tags: [Usuarios]
      summary: Lista los usuarios del tenant.
      description: Requiere el permiso `manage_users`.
      operationId: listUsers
      x-permission: manage_users
      responses:
        '200':
          description: Usuarios del tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                required: [users]
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_users`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Usuarios]
      summary: Crea un usuario.
      description: |
        Requiere el permiso `manage_users`. Sólo un `OWNER` puede crear otro `OWNER`;
        un email duplicado responde **409**.
      operationId: createUser
      x-permission: manage_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required: [user]
        '400':
          description: Cuerpo inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_users` o intento de crear un `OWNER` sin serlo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El email ya existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{id}:
    patch:
      tags: [Usuarios]
      summary: Actualiza el rol de un usuario.
      description: |
        Requiere `manage_users`; sólo un `OWNER` puede cambiar roles. No se puede
        cambiar el propio rol: **400**.
      operationId: updateUser
      x-permission: manage_users
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required: [user]
        '400':
          description: Cuerpo inválido o intento de cambiarse el propio rol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_users` o sin ser `OWNER` para cambiar roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Usuarios]
      summary: Borra un usuario.
      description: |
        Requiere `manage_users` y el rol `OWNER`. No se puede borrar a uno mismo:
        **400**.
      operationId: deleteUser
      x-permission: manage_users
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Usuario borrado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Intento de borrarse a sí mismo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_users` o sin ser `OWNER`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ftth_session
      description: |
        Cookie de sesión (HttpOnly) que emite `/api/auth/login` o `/api/auth/signup`.
        El middleware no autentica: cada handler resuelve la sesión con
        `getCurrentUser()` y chequea permisos.

  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: Identificador del recurso.
      schema:
        type: string
    PathZoneId:
      name: zoneId
      in: path
      required: true
      description: Identificador de la zona.
      schema:
        type: string
    PathMarkerId:
      name: markerId
      in: path
      required: true
      description: Identificador del marcador.
      schema:
        type: string
    PathRunId:
      name: runId
      in: path
      required: true
      description: Identificador de la corrida de investigación.
      schema:
        type: string

  schemas:
    Error:
      type: object
      description: Error del handler. La forma no es uniforme en todo el repo.
      properties:
        error:
          type: string
      required: [error]

    ErrorDetail:
      type: object
      description: Error con detalle del origen.
      properties:
        error:
          type: string
        detail:
          type: string
      required: [error]

    RateLimitedError:
      type: object
      description: Cuota excedida.
      properties:
        error:
          type: string
        retryAfter:
          type: number
      required: [error]

    ConflictError:
      type: object
      description: Conflicto con un recurso existente.
      properties:
        error:
          type: string
        existingId:
          type: string
      required: [error]

    MaintenanceOverlapError:
      type: object
      description: La ventana se solapa con otra existente.
      properties:
        error:
          type: string
          enum: [overlap]
        overlappingWindowId:
          type: string
      required: [error]

    AlreadyTerminalError:
      type: object
      description: El recurso ya está en estado terminal.
      properties:
        error:
          type: string
          enum: [already_terminal]
        currentStatus:
          type: string
      required: [error]

    FeatureDisabledError:
      type: object
      description: La feature está deshabilitada por configuración.
      properties:
        error:
          type: string
          enum: [disabled]
        feature:
          type: string
      required: [error, feature]

    MisconfiguredChannelError:
      type: object
      description: El canal guardado tiene valores no reconocidos.
      properties:
        error:
          type: string
        stored:
          type: object
          additionalProperties: true
      required: [error]

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]

    Role:
      type: string
      description: Rol del usuario. `MEMBER` es el alias histórico de `OPERATOR`.
      enum: [OWNER, ADMIN, OPERATOR, MEMBER]

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      required: [id, email, name, role]

    Tenant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required: [id, name]

    SessionUser:
      type: object
      description: Usuario con el contexto de su sesión.
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        tenantId:
          type: string
        mfaEnabled:
          type: boolean
        tenant:
          $ref: '#/components/schemas/Tenant'
      required: [id, email, name, role, tenantId]

    CurrentUserResponse:
      type: object
      description: |
        `user: null` cuando no hay sesión válida: es una respuesta normal, no un error.
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/SessionUser'
            - type: 'null'
      required: [user]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required: [user]

    MfaRequiredResponse:
      type: object
      description: "El usuario tiene MFA activo: falta el segundo factor."
      properties:
        mfaRequired:
          type: boolean
          const: true
        tempToken:
          type: string
      required: [mfaRequired, tempToken]

    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 120
        tenantName:
          type: [string, "null"]
          minLength: 1
      required: [email, password]

    SignupResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tenant:
          $ref: '#/components/schemas/Tenant'
      required: [user, tenant]

    MfaSetupResponse:
      type: object
      properties:
        secret:
          type: string
          description: Secreto TOTP en base32.
        otpauthUri:
          type: string
          format: uri
        issuer:
          type: string
        account:
          type: string
        format:
          type: string
          const: base32
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
      required: [secret, otpauthUri, issuer, account, format, digits, period]

    MfaEnabledResponse:
      type: object
      properties:
        mfaEnabled:
          type: boolean
      required: [mfaEnabled]

    TotpRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 16
      required: [code]

    MfaVerifyRequest:
      type: object
      description: |
        Acepta tres formas: `{email,password,code}`, `{code}` o `{tempToken,code}`.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        code:
          type: string
          minLength: 1
        tempToken:
          type: string
      required: [code]

    HealthReport:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
        memory:
          type: object
          properties:
            rss:
              type: number
            heapUsed:
              type: number
          required: [rss, heapUsed]
        version:
          type: string
        database:
          type: object
          additionalProperties: true
        services:
          type: object
          additionalProperties: true
        hungLoops:
          type: array
          items:
            type: object
            additionalProperties: true
        connections:
          type: object
          additionalProperties: true
        ingest:
          type: object
          additionalProperties: true
      required: [status, timestamp, uptime, memory, version]

    ChatRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 8000
        conversationId:
          type: [string, "null"]
          minLength: 1
        connectionId:
          type: [string, "null"]
          minLength: 1
      required: [message]

    ChatResponse:
      type: object
      properties:
        reply:
          type: string
        toolsUsed:
          type: array
          items:
            type: string
        conversationId:
          type: string
        dataSource:
          type: string
        abstention:
          type: object
          additionalProperties: true
      required: [reply, toolsUsed, conversationId, dataSource]

    ConversationSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        messageCount:
          type: integer
      required: [id, title, updatedAt, createdAt, messageCount]

    ConversationList:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummary'
      required: [conversations]

    ConversationMessage:
      type: object
      properties:
        id:

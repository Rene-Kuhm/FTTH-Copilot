        '400':
          description: Cuerpo inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `view_network`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ops/stream:
    get:
      tags: [Ops]
      summary: Stream SSE del estado operativo.
      description: |
        Eventos `snapshot`, `delta` y `heartbeat`. El heartbeat late cada 10 s y el
        snapshot se emite cada 3° del stream.
      operationId: streamOpsEvents
      x-permission: view_network
      responses:
        '200':
          description: Stream de eventos.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Sin sesión.
          content:

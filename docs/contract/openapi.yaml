x-implementation-notes:
  description: |
    Observaciones verificadas en el código, no recomendaciones. Sirven para no
    asumir cosas que el contrato real no garantiza.
  notes:
    - "`GET /api/maintenance-windows` no chequea permiso, mientras que `POST` sí exige `manage_maintenance` (`api/maintenance-windows/route.ts:42` vs `:161`)."
    - "`/api/vm/query` y `/api/vm/instant` no tienen autenticación y aceptan PromQL arbitrario del query string."
    - "El middleware exime de CSRF a todo `/api/auth/*`, y `POST /api/auth/mfa/verify` sets **sólo** la cookie de sesión, no la de CSRF (a diferencia de `/api/auth/login` y `/api/auth/signup`)."
    - "La forma del error 401 no es uniforme: casi todos devuelven `{error:'Not authenticated'}`; `/api/conversations/[id]` devuelve `{error:'No autenticado.'}` y `/api/ops/stream` devuelve texto plano `Unauthorized`."
    - "Sólo `/api/incidents` y `/api/predictions` usan paginación por cursor (`apps/web/lib/api/pagination.ts`: `DEFAULT_LIMIT=50`, `MAX_LIMIT=200`)."

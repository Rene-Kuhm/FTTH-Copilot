                      $ref: '#/components/schemas/NotificationChannel'
                  recentDeliveries:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required: [channels]
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `view_network`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Mantenimiento y on-call]
      summary: Crea un canal de notificación.
      operationId: createNotificationChannel
      x-permission: manage_maintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationChannelRequest'
      responses:
        '201':
          description: Canal creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    $ref: '#/components/schemas/NotificationChannel'
                required: [channel]
        '400':
          description: Cuerpo inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_maintenance`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Mantenimiento y on-call]
      summary: Actualiza un canal de notificación.
      operationId: updateNotificationChannel
      x-permission: manage_maintenance
      parameters:
        - name: id
          in: query
          required: true
          description: Identificador del canal.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationChannelRequest'
      responses:
        '200':
          description: Canal actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    $ref: '#/components/schemas/NotificationChannel'
                required: [channel]
        '400':
          description: Cuerpo inválido o falta `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_maintenance`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Mantenimiento y on-call]
      summary: Borra un canal de notificación.
      operationId: deleteNotificationChannel
      x-permission: manage_maintenance
      parameters:
        - name: id
          in: query
          required: true
          description: Identificador del canal.
          schema:
            type: string
      responses:
        '200':
          description: Canal borrado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Falta `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_maintenance`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Mantenimiento y on-call]
      summary: Dry-run de un canal de notificación.
      description: |
        Entrega un payload sintético y reporta el resultado **sin** escribir la fila de
        entrega. Un canal deshabilitado responde **409** y uno mal configurado **422**.
      operationId: testNotificationChannel
      x-permission: manage_maintenance
      parameters:
        - name: id
          in: query
          required: true
          description: Identificador del canal.
          schema:
            type: string
      responses:
        '200':
          description: Resultado del dry-run.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Falta `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permiso `manage_maintenance`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El canal no existe en el tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El canal está deshabilitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: El canal está mal configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MisconfiguredChannelError'


services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ftth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ftth_copilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ftth} -d $${POSTGRES_DB:-ftth_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ftth-network

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dependencies
    restart: "no"
    command: ["pnpm", "--filter", "@ftth-copilot/db", "db:deploy"]
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ftth-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ftth-copilot:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "${PORT:-3001}:3001"
      - "${SNMP_UDP_PORT:-1162}:1162/udp"
      - "${SYSLOG_UDP_PORT:-5514}:5514/udp"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - ftth-network

  # ─────────────────────────────────────────────────────────────────────
  # VictoriaMetrics — Time-series database + Dashboard UI
  # Production-grade TSDB with 1-year retention by default,
  # built-in Grafana-compatible UI, and Prometheus-compatible API.
  #
  # Access: http://localhost:8428 (VM UI + Prometheus-compatible API)
  # Docs: https://docs.victoriametrics.com/
  # Note: Expose via reverse proxy (Caddy) with HTTPS + basic auth in production.
  #
  # Licensing: the community image is AGPL-3.0. Run it as a separate service
  # that FTTH-Copilot only talks to over HTTP. Confirm the intended
  # deployment shape with counsel before commercial rollout.
  # ─────────────────────────────────────────────────────────────────────
  victoriametrics:
    image: ${VICTORIAMETRICS_IMAGE:-victoriametrics/victoria-metrics:v1.153.0}
    container_name: ftth_prod_victoriametrics
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/vm/entrypoint.sh"]
    environment:
      VICTORIAMETRICS_SCRAPE_TARGET: ${VICTORIAMETRICS_SCRAPE_TARGET:-app:3001}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
      # Retention is expressed in months: 12 = 1 year, 60 = 5 years.
      VM_RETENTION_PERIOD: ${VICTORIAMETRICS_RETENTION:-12}
      VM_LOG_LEVEL: ${VICTORIAMETRICS_LOG_LEVEL:-INFO}
    ports:
      - "${VICTORIAMETRICS_PORT:-8428}:8428"
    volumes:
      - victoriametrics_prod_data:/storage
      - ./docker/victoriametrics-entrypoint.sh:/opt/vm/entrypoint.sh:ro
      - ./docker/victoriametrics-scrape.yml:/etc/victoriametrics/scrape.yml.tmpl:ro
    healthcheck:
      # 127.0.0.1, not localhost: inside this image localhost resolves to ::1
      # first and VictoriaMetrics listens on IPv4 only, so localhost refuses.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      app:
        condition: service_started
    networks:
      - ftth-network

  # ─────────────────────────────────────────────────────────────────────
  # vmalert — recording + alerting rules.
  # Single-node VictoriaMetrics does not evaluate PromQL rules, so this runs as
  # a sidecar against the VM query API and writes recorded series back over
  # remote write.
  #
  # Wiring a real notification channel is deployment-specific. Add a
  # notifier config (webhook / email / PagerDuty) and mount it at
  # /etc/vmalert/notifier.yml, then pass -notifier.config=/etc/vmalert/notifier.yml.
  # ─────────────────────────────────────────────────────────────────────
  vmalert:
    image: ${VMALERT_IMAGE:-victoriametrics/vmalert:v1.153.0}
    container_name: ftth_prod_vmalert
    restart: unless-stopped
    entrypoint: ["/vmalert-prod"]
    command:
      - '-rule=/etc/vmalert/rules.yml'
      - '-datasource.url=http://victoriametrics:8428'
      # Single-node appends /api/v1/write itself; do NOT include the path here.
      - '-remoteWrite.url=http://victoriametrics:8428'
      - '-notifier.url=http://victoriametrics:8428'
      - '-loggerLevel=${VMALERT_LOG_LEVEL:-INFO}'
    volumes:
      - ./docker/victoriametrics-alerts.yml:/etc/vmalert/rules.yml:ro
    depends_on:
      victoriametrics:
        condition: service_started
    networks:
      - ftth-network

volumes:
  postgres_data:
  victoriametrics_prod_data:

networks:
  ftth-network:
    driver: bridge

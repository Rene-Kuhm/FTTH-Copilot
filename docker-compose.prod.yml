services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ftth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ftth_copilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ftth} -d $${POSTGRES_DB:-ftth_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ftth-network

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dependencies
    restart: "no"
    command: ["pnpm", "--filter", "@ftth-copilot/db", "db:deploy"]
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ftth-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ftth-copilot:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "${PORT:-3001}:3001"
      - "${SNMP_UDP_PORT:-1162}:1162/udp"
      - "${SYSLOG_UDP_PORT:-5514}:5514/udp"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - ftth-network

  # ─────────────────────────────────────────────────────────────────────
  # VictoriaMetrics — Time-series database + Dashboard UI
  # Production-grade TSDB with 1-year retention by default,
  # built-in Grafana-compatible UI, and Prometheus-compatible API.
  #
  # Access: http://localhost:8428 (VM UI + Prometheus-compatible API)
  # Docs: https://docs.victoriametrics.com/
  # Note: Expose via reverse proxy (Caddy) with HTTPS + basic auth in production.
  # ─────────────────────────────────────────────────────────────────────
  victoriametrics:
    image: victoriametrics/victorial:latest
    container_name: ftth_prod_victoriametrics
    restart: unless-stopped
    command:
      - '-storageDataPath=/storage'
      - '-retentionPeriod=${VICTORIAMETRICS_RETENTION:-12}'
      - '-httpListenAddr=:8428'
      - '-scrape.verbose=false'
      - '-scrape.timeout=10s'
      - '-scrape.interval=30s'
      # In production, set VICTORIAMETRICS_RETENTION=60 for 5-year retention.
      # Retention is in months. 12 = 1 year, 60 = 5 years.
    ports:
      - "${VICTORIAMETRICS_PORT:-8428}:8428"
    volumes:
      - victoriametrics_prod_data:/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8428/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      app:
        condition: service_started
    networks:
      - ftth-network

volumes:
  postgres_data:
  victoriametrics_prod_data:

networks:
  ftth-network:
    driver: bridge

networks:
  ftth-network:
    driver: bridge

volumes:
  # Buffered syslog/SNMP events awaiting a write to Postgres. Losing this
  # volume loses telemetry, so it is treated as persistent state.
  spool_data:
  # PostgreSQL data directory — losing this loses all FTTH-Copilot state.
  postgres_data:
  # VictoriaMetrics persistent storage — losing this loses all metrics history.
  victoriametrics_prod_data:

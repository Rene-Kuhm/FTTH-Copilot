name: CI

# Se dispara en cada push a cualquier rama y en cada Pull Request hacia main.
# Todo corre 100% sobre GitHub Actions (2.000 min/mes gratis en repos privados),
# sin ningún servicio de pago ni ninguna API key de proveedor de LLM.
# El agente (Claude, GPT, DeepSeek, el que sea) NO se llama en este pipeline:
# los tests usan mocks (MSW) para simular respuestas del LLM y de las APIs
# externas (SmartOLT, etc.), así el CI corre igual sin importar qué agente
# elijas usar en desarrollo o en producción.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

# Cancela runs anteriores del mismo branch/PR si llega un push nuevo,
# para no desperdiciar minutos gratuitos de Actions.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos necesarios (principio de menor privilegio).
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.22.0"

jobs:
  # ────────────────────────────────────────────────────────────
  # 1) Lint + typecheck — falla rápido, antes de gastar minutos
  #    en jobs más pesados.
  # ────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ftth-copilot/db exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ────────────────────────────────────────────────────────────
  # 2) Tests unitarios — rápidos, sin dependencias externas.
  #    Cubre packages/connectors, packages/agent-core, etc.
  # ────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Check coverage thresholds
        run: pnpm test:coverage-check

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: "**/coverage/**"
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # 3) Build — confirma que todo el monorepo compila.
  # ────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - test-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ftth-copilot/db exec prisma generate

      - name: Build all packages
        run: pnpm build

  # ────────────────────────────────────────────────────────────
  # 4) E2E — valida la navegación y los contratos UI/API.
  # ────────────────────────────────────────────────────────────
  test-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @ftth-copilot/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

  # ────────────────────────────────────────────────────────────
  # 5) Integración — migraciones + flujo de detección contra un
  #    Postgres real (service container), sin mocks.
  # ────────────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ftth
          POSTGRES_PASSWORD: ftth
          POSTGRES_DB: ftth_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ftth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ftth:ftth@localhost:5432/ftth_copilot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ftth-copilot/db exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @ftth-copilot/db exec prisma migrate deploy

      - name: Run integration tests
        run: pnpm --filter @ftth-copilot/alerts test:integration

  # ────────────────────────────────────────────────────────────
  # 6) Gate final — job "resumen" que agrupa todo lo anterior.
  #    Configurar ESTE job como required status check en la
  #    protección de rama de main, así no hay que ir actualizando
  #    la regla cada vez que se agrega un job.
  # ────────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - test-unit
      - build
      - test-e2e
      - test-integration
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "Al menos un job falló."
            exit 1
          fi
          echo "Todos los jobs requeridos pasaron correctamente."

name: CI

# Se dispara en cada Pull Request hacia main, y en cada push a main.
#
# Ojo: NO se dispara en pushes a ramas de feature. Con `push: "**"`, cada
# push a una branch con PR abierto lanzaría DOS runs completos de CI (uno por
# `push` y otro por `pull_request`). Ambos compiten por los mismos runners,
# la saturación cancela jobs del gate `ci-success`, y el merge queda
# bloqueado aunque el código esté bien. Con un solo run por PR no hay
# contención y el gate refleja el estado real.
#
# Todo corre 100% sobre GitHub Actions (2.000 min/mes gratis en repos privados),
# sin ningún servicio de pago ni ninguna API key de proveedor de LLM.
# El agente (Claude, GPT, DeepSeek, el que sea) NO se llama en este pipeline:
# los tests usan mocks (MSW) para simular respuestas del LLM y de las APIs
# externas (SmartOLT, etc.), así el CI corre igual sin importar qué agente
# elijas usar en desarrollo o en producción.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancela runs anteriores del mismo branch/PR si llega un push nuevo,
# para no desperdiciar minutos gratuitos de Actions.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos necesarios (principio de menor privilegio).
permissions:
  contents: read

env:
  # La versión de mise está fijada: el CI usa el mismo gestor y las
  # mismas versiones exactas que el entorno local (mise.toml + mise.lock).
  MISE_VERSION: "2026.10.12"

jobs:
  # ────────────────────────────────────────────────────────────
  # 1) Lint + typecheck — falla rápido, antes de gastar minutos
  #    en jobs más pesados.
  # ────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    # Mínimo privilegio: este job sólo lee el repo.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (Node + pnpm con versiones exactas)
        uses: jdx/mise-action@c94f0bf9e520b150e34c017db785461f7e71c5fb # v2.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          # --locked falla si mise.lock no cubre lo que pide mise.toml:
          # el CI no puede instalar una versión distinta de la declarada.
          install_args: --locked

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ftth-copilot/db exec prisma generate

      - name: Lint
        run: mise run lint

      - name: Typecheck
        run: mise run typecheck

      - name: Validate OLT research sources and matrix drift
        run: |
          pnpm check:sources
          pnpm generate:matrix:write
          git diff --exit-code docs/compatibility-matrix.md

      - name: Check OID semantic conflicts
        run: pnpm check:conflicts

      - name: Validate contribution templates
        run: pnpm check:contribution

  # ────────────────────────────────────────────────────────────
  # 2) Documentación viva — cada ejemplo de README.md y docs/ se
  #    contrasta contra el código real (scripts, exports, archivos,
  #    variables de entorno). Un ejemplo roto no se mergea.
  #    El repo-map imprime el esqueleto del repo y falla si se pasa
  #    del presupuesto de tokens.
  # ────────────────────────────────────────────────────────────
  docs-test:
    name: Docs (zero-drift) & repo map
    runs-on: ubuntu-latest
    # Mínimo privilegio: este job sólo lee el repo.
    permissions:
      contents: read
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (Node + pnpm con versiones exactas)
        uses: jdx/mise-action@c94f0bf9e520b150e34c017db785461f7e71c5fb # v2.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          # --locked falla si mise.lock no cubre lo que pide mise.toml:
          # el CI no puede instalar una versión distinta de la declarada.
          install_args: --locked

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify documentation examples
        run: mise run docs-test

      - name: Print the repo skeleton
        run: mise run repo-map > repo-map.txt

      - name: Upload repo map artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-map
          path: repo-map.txt
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # 2) Tests unitarios — rápidos, sin dependencias externas.
  #    Cubre packages/connectors, packages/agent-core, etc.
  # ────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Mínimo privilegio: este job sólo lee el repo.
    permissions:
      contents: read
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (Node + pnpm con versiones exactas)
        uses: jdx/mise-action@c94f0bf9e520b150e34c017db785461f7e71c5fb # v2.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          # --locked falla si mise.lock no cubre lo que pide mise.toml:
          # el CI no puede instalar una versión distinta de la declarada.
          install_args: --locked

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check coverage thresholds
        run: mise run test:coverage-check

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: "**/coverage/**"
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # 3) Eval gate (Fase F PR-time attack-pass-rate == 100%).
  #
  # Why this job exists (single source of truth):
  #   Every PR must pass the Fase F adversarial corpus before merge. The
  #   harness (`packages/eval`) drives `runAgent` against a committable
  #   JSON corpus (pink + red), mocks the LLM seam, and asserts:
  #     - attack-pass-rate >= 1.0 (strict 100% gate on the red corpus)
  #     - surface coverage of all 7 mapped untrusted-input surfaces
  #     - injection-kind coverage of all 7 attack kinds
  #   Vitest exits non-zero on any assertion failure → job exits non-zero
  #   → `ci-success` aggregator reports the gate breach → PR is blocked.
  #   The job is KEYLESS (no `secrets.*` reference, no `OPENAI_API_KEY`,
  #   `ANTHROPIC_API_KEY`, or `MINIMAX_API_KEY` read at any point) so it
  #   runs identically on public/private repos and never burns LLM tokens.
  #   `if: always()` keeps the gate honest when an upstream job fails —
  #   the eval contract is independent of lint/typecheck/unit results.
  # ────────────────────────────────────────────────────────────
  eval:
    name: Eval Gate (attack-pass-rate == 100%)
    runs-on: ubuntu-latest
    # Mínimo privilegio: este job sólo lee el repo.
    permissions:
      contents: read
    needs:
      - test-unit
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (Node + pnpm con versiones exactas)
        uses: jdx/mise-action@c94f0bf9e520b150e34c017db785461f7e71c5fb # v2.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          # --locked falla si mise.lock no cubre lo que pide mise.toml:
          # el CI no puede instalar una versión distinta de la declarada.
          install_args: --locked

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ftth-copilot/db exec prisma generate

      - name: Run eval harness (strict 100% gate)
        run: pnpm --filter @ftth-copilot/eval run test

      - name: Lint eval package
        run: pnpm --filter @ftth-copilot/eval run lint

  # ────────────────────────────────────────────────────────────
  # 4) Build — confirma que todo el monorepo compila.
  # ────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    # Mínimo privilegio: este job sólo lee el repo.
    permissions:
      contents: read
    needs:
      - test-unit
      - eval
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (Node + pnpm con versiones exactas)
        uses: jdx/mise-action@c94f0bf9e520b150e34c017db785461f7e71c5fb # v2.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          # --locked falla si mise.lock no cubre lo que pide mise.toml:
          # el CI no puede instalar una versión distinta de la declarada.
          install_args: --locked

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ftth-copilot/db exec prisma generate

      - name: Build all packages
        run: mise run build

  # ────────────────────────────────────────────────────────────
  # 4) E2E — valida la navegación y los contratos UI/API.
  # ────────────────────────────────────────────────────────────
  test-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Mínimo privilegio: este job sólo lee el repo.
    permissions:
      contents: read
    needs:
      - build
    # The new auth-real.spec.ts (PR #108) issues real HTTP requests to
    # /api/auth/* which require a live Postgres connection. The other
    # specs mock /api/auth/* via page.route() and don't need a DB, but
    # spinning one up for the whole job is cheaper than splitting the
    # suite into "real" and "mocked" runners.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ftth
          POSTGRES_PASSWORD: ftth
          POSTGRES_DB: ftth_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ftth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ftth:ftth@localhost:5432/ftth_copilot
      # Required by the auth backend in production mode. The previous
      # auth.spec.ts mocked the routes so this was never exercised;
      # the new auth-real.spec.ts (PR #108) actually calls /api/auth/*
      # and hits the "JWT_SECRET is not set" guard.
      JWT_SECRET: e2e-jwt-secret-for-playwright-only
      KMS_MASTER_KEY: e2e-kms-master-key-for-playwright-only
      # The middleware auth bypass is off unless this is explicitly set. It was
      # previously unconditional, which meant one header skipped authentication
      # and RBAC on any deployment.
      ENABLE_TEST_AUTH_BYPASS: "true"
      # Used by middleware-auth.spec.ts, which clears the bypass cookie and
      # exercises the real middleware. Same account the demo seeds.
      SEED_ADMIN_PASSWORD: e2e-demo-password-12345
      E2E_LOGIN_EMAIL: admin@ftth-copilot.local
      E2E_LOGIN_PASSWORD: e2e-demo-password-12345
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (Node + pnpm con versiones exactas)
        uses: jdx/mise-action@c94f0bf9e520b150e34c017db785461f7e71c5fb # v2.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          # --locked falla si mise.lock no cubre lo que pide mise.toml:
          # el CI no puede instalar una versión distinta de la declarada.
          install_args: --locked

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: mise run build

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.62.1
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium and headless shell
        run: |
          pnpm --filter @ftth-copilot/web exec playwright install --with-deps chromium
          pnpm --filter @ftth-copilot/web exec playwright install chromium-headless-shell

      - name: Generate Prisma Client
        run: pnpm --filter @ftth-copilot/db exec prisma generate

      # migrate deploy, not db push. db push builds a schema straight from
      # schema.prisma and never touches the SQL in prisma/migrations, so a
      # broken migration shipped green. This is also the command production runs
      # (db-migrate in docker-compose.prod.yml), so CI now exercises the same
      # path as a real deployment.
      - name: Apply migrations
        run: pnpm --filter @ftth-copilot/db db:deploy

      # middleware-auth.spec.ts logs in for real, so the admin account has to
      # exist. Every other E2E test uses the bypass cookie and never needed it,
      # which is why the middleware could be broken and the suite stay green.
      - name: Seed the admin account
        run: pnpm --filter @ftth-copilot/db db:seed

      - name: Run E2E tests
        run: mise run test:e2e

  # ────────────────────────────────────────────────────────────
  # 5) Integración — migraciones + flujo de detección contra un
  #    Postgres real (service container), sin mocks.
  # ────────────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    # Mínimo privilegio: este job sólo lee el repo.
    permissions:
      contents: read
    needs:
      - lint-and-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ftth
          POSTGRES_PASSWORD: ftth
          POSTGRES_DB: ftth_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ftth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ftth:ftth@localhost:5432/ftth_copilot
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (Node + pnpm con versiones exactas)
        uses: jdx/mise-action@c94f0bf9e520b150e34c017db785461f7e71c5fb # v2.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          # --locked falla si mise.lock no cubre lo que pide mise.toml:
          # el CI no puede instalar una versión distinta de la declarada.
          install_args: --locked

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # See the E2E job: db push would never run the migration SQL, so a broken
      # or drifted migration would pass here.
      - name: Bootstrap environment
        run: pnpm --filter @ftth-copilot/db db:deploy

      # Seeding is intentionally NOT run here. It is not idempotent (it uses
      # prisma create, not upsert) and it was guarded with `|| true`, so a
      # broken seed left CI green. No test depends on it: every integration
      # suite creates its own fixtures, and tests/seed.test.ts exercises the
      # seed directly against the pushed schema.

      - name: Run database tests
        run: pnpm --filter @ftth-copilot/db test

      # These specs are excluded from `vitest run` so unit and coverage runs stay
      # hermetic. Without this step they never run at all, and the Prisma models
      # and store are only covered by mocks. Requires the Postgres service and
      # the schema pushed above.
      - name: Run database integration tests
        run: pnpm --filter @ftth-copilot/db test:integration

      - name: Run integration tests
        run: pnpm --filter @ftth-copilot/alerts test:integration

  # ────────────────────────────────────────────────────────────
  # 6) Título de la PR — los merges son squash, así que el título
  #    de la PR es el mensaje del commit. Si el título no es un
  #    Conventional Commit, release-please no lo puede parsear: la
  #    release no sube de versión y el changelog pierde la entrada.
  #
  #    El job es liviano (no instala dependencias del monorepo):
  #    commitlint corre con npx y lee la convención del repositorio
  #    desde .commitlintrc.json.
  # ────────────────────────────────────────────────────────────
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    # Mínimo privilegio: este job sólo lee el repo.
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (Node + pnpm con versiones exactas)
        uses: jdx/mise-action@c94f0bf9e520b150e34c017db785461f7e71c5fb # v2.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: --locked

      - name: Validate the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" | npx --yes @commitlint/cli@21.2.4 --verbose

  # ────────────────────────────────────────────────────────────
  # 7) Supply chain — la política no se relaja en silencio.
  #
  #    Tres reglas, verificadas contra los YAML del propio repositorio:
  #      a) toda acción de terceros se usa fijada por SHA de commit
  #         (nunca por tag ni por rama: un tag se puede mover);
  #      b) todo job declara su propio bloque `permissions:`;
  #      c) el pipeline de release está cableado de punta a punta: el
  #         workflow que publica la release despacha al que compila y
  #         atesta los artefactos, porque el tag lo crea el
  #         GITHUB_TOKEN y un push de tag hecho por el GITHUB_TOKEN no
  #         dispara ningún workflow.
  #
  #    El check es hermético: sólo lee archivos del repo. No instala
  #    dependencias ni habla con la red, así que no puede fallar por
  #    causas externas al contenido del pull request.
  #
  #    La implementación vive en `scripts/lib/supply-chain.ts` y es la
  #    misma que corren los tests de `scripts/tests/supply-chain.test.ts`.
  # ────────────────────────────────────────────────────────────
  supply-chain:
    name: Supply Chain Policy
    runs-on: ubuntu-latest
    # Mínimo privilegio: este job sólo lee el repo.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (Node + pnpm con versiones exactas)
        uses: jdx/mise-action@c94f0bf9e520b150e34c017db785461f7e71c5fb # v2.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: --locked

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the supply chain policy
        run: pnpm check:supply-chain

      - name: Run the supply chain tests
        run: mise run test-scripts

  # ────────────────────────────────────────────────────────────
  # 8) Gate final — job "resumen" que agrupa todo lo anterior.
  #    Configurar ESTE job como required status check en la
  #    protección de rama de main, así no hay que ir actualizando
  #    la regla cada vez que se agrega un job.
  # ────────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    # Mínimo privilegio: este job sólo lee el repo.
    permissions:
      contents: read
    needs:
      - lint-and-typecheck
      - docs-test
      - test-unit
      - eval
      - build
      - test-e2e
      - test-integration
      - pr-title
      - supply-chain
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          LINT_AND_TYPECHECK_RESULT: ${{ needs.lint-and-typecheck.result }}
          DOCS_TEST_RESULT: ${{ needs.docs-test.result }}
          TEST_UNIT_RESULT: ${{ needs.test-unit.result }}
          EVAL_RESULT: ${{ needs.eval.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_E2E_RESULT: ${{ needs.test-e2e.result }}
          TEST_INTEGRATION_RESULT: ${{ needs.test-integration.result }}
          PR_TITLE_RESULT: ${{ needs.pr-title.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
        run: |
          # The pull request title only exists for pull request events. On a
          # push to main the title job is skipped and the title is not part
          # of the gate.
          if [ "$PR_TITLE_RESULT" = "skipped" ]; then
            PR_TITLE_RESULT="success"
          fi
          if [ "$LINT_AND_TYPECHECK_RESULT" != "success" ] || \
             [ "$DOCS_TEST_RESULT" != "success" ] || \
             [ "$TEST_UNIT_RESULT" != "success" ] || \
             [ "$EVAL_RESULT" != "success" ] || \
             [ "$BUILD_RESULT" != "success" ] || \
             [ "$TEST_E2E_RESULT" != "success" ] || \
             [ "$TEST_INTEGRATION_RESULT" != "success" ] || \
             [ "$PR_TITLE_RESULT" != "success" ] || \
             [ "$SUPPLY_CHAIN_RESULT" != "success" ]; then
            echo "At least one required job did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded."

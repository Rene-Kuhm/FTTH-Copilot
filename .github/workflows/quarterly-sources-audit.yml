name: Quarterly Research Sources & Link Audit

on:
  schedule:
    # Run at 00:00 UTC on the 1st day of every 3rd month (Jan, Apr, Jul, Oct)
    - cron: '0 0 1 */3 *'
  workflow_dispatch:

# Least privilege: the audit only reads the repository.
permissions:
  contents: read

jobs:
  sources-audit:
    name: Audit OLT Research Sources, Errata, & Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Source Registry Schema
        run: pnpm check:sources

      - name: Check OID Collisions & Semantic Conflicts
        run: pnpm check:conflicts

      - name: Validate Vendor Contributions
        run: pnpm check:contribution

      - name: Verify Link Integrity & Source URL Reachability
        run: pnpm check:sources:health --timeout=8000

      - name: Verify Compatibility Matrix Freshness
        run: |
          pnpm generate:matrix:write
          git diff --exit-code docs/compatibility-matrix.md || (echo "Compatibility matrix out of date. Run 'pnpm generate:matrix:write' and commit." && exit 1)

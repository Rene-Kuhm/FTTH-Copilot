name: Terraform AWS Reference

on:
  push:
    branches: [main]
    paths:
      - "infra/aws/**"
      - "scripts/db-backup.sh"
      - "scripts/db-restore.sh"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/aws/**"
      - "scripts/db-backup.sh"
      - "scripts/db-restore.sh"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TERRAFORM_VERSION: "1.17.2"
  TFLINT_VERSION: "0.66.0"
  TRIVY_VERSION: "0.60.0"

jobs:
  static-and-mock-tests:
    name: Layer 1-2 — Static Checks & Mocked Terraform Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform, TFLint, and Trivy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
          unzip -qo /tmp/terraform.zip -d /usr/local/bin
          rm -f /tmp/terraform.zip

          curl -fsSL "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" -o /tmp/tflint.zip
          unzip -qo /tmp/tflint.zip -d /usr/local/bin
          rm -f /tmp/tflint.zip

          docker pull "aquasec/trivy:${TRIVY_VERSION}"

          terraform version
          tflint --version
          docker run --rm "aquasec/trivy:${TRIVY_VERSION}" --version

      - name: Terraform fmt check
        working-directory: infra/aws
        run: terraform fmt -check -recursive

      - name: Terraform init & validate
        working-directory: infra/aws
        run: |
          terraform init -backend=false
          terraform validate

      - name: TFLint check
        working-directory: infra/aws
        run: |
          tflint --init
          tflint --recursive

      - name: Trivy IaC security scan
        working-directory: infra/aws
        run: docker run --rm -v "$PWD:/src" -w /src "aquasec/trivy:${TRIVY_VERSION}" config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs tests --ignorefile .trivyignore.yaml .

      - name: Layer 2 — Terraform native unit tests (mocked providers)
        working-directory: infra/aws
        run: terraform test

  emulator-integration:
    name: Layer 3-4 — AWS Emulator Apply, Idempotency & S3 Backup/Restore
    runs-on: ubuntu-24.04
    needs: static-and-mock-tests
    permissions:
      contents: read
    env:
      # Local emulator only. Dummy credentials; no AWS account is ever used here.
      AWS_ENDPOINT_URL: "https://127.0.0.1:9297"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_REGION: "us-east-1"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CA_BUNDLE: "/tmp/aws-emulator-ca.pem"
      TF_VAR_emulator_mode: "true"
      TF_VAR_s3_use_path_style: "true"
      TF_VAR_enable_emulated_unsupported_resources: "false"
      TF_VAR_allowed_account_ids: '["000000000000"]'
      TF_VAR_allowed_udp_cidrs: '["198.51.100.0/24"]'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ftth
          POSTGRES_PASSWORD: ftth_emulator_password
          POSTGRES_DB: ftth_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ftth -d ftth_copilot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform, AWS CLI v2, and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
          unzip -qo /tmp/terraform.zip -d /usr/local/bin
          rm -f /tmp/terraform.zip

          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          rm -rf /tmp/awscliv2.zip /tmp/aws
          aws --version

          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Install AWS Emulator from the official release package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/aws-emulator-pkg
          gh release view --repo aws/aws-emulator --json assets --jq '.assets[].name' > /tmp/aws-emulator-assets.txt
          echo "Assets in the latest aws/aws-emulator release:"
          cat /tmp/aws-emulator-assets.txt
          ASSET="$(grep -Ei '(amd64|x86_64|x64).*\.deb$' /tmp/aws-emulator-assets.txt | head -n 1 || true)"
          if [ -z "$ASSET" ]; then
            echo "::error::the latest aws/aws-emulator release has no amd64 .deb package (see the list above)"
            exit 1
          fi
          gh release download --repo aws/aws-emulator --pattern "$ASSET" --dir /tmp/aws-emulator-pkg
          sudo apt-get install -y "/tmp/aws-emulator-pkg/$ASSET"
          command -v aws-emulator

      - name: Start AWS Emulator (telemetry disabled) and trust its certificate
        shell: bash
        env:
          EMULATOR_TELEMETRY: "off"
        run: |
          set -euo pipefail
          nohup aws-emulator --telemetry off > /tmp/aws-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sk https://127.0.0.1:9297/ -o /dev/null; then
              break
            fi
            sleep 1
          done
          openssl s_client -connect 127.0.0.1:9297 -servername 127.0.0.1 </dev/null 2>/dev/null \
            | openssl x509 -outform PEM > /tmp/aws-emulator-ca.pem
          test -s /tmp/aws-emulator-ca.pem || { echo "::error::could not read the emulator certificate"; exit 1; }
          sudo cp /tmp/aws-emulator-ca.pem /usr/local/share/ca-certificates/aws-emulator.crt
          sudo update-ca-certificates

      - name: Layer 3 — Terraform apply, idempotency check, against AWS Emulator
        id: apply
        working-directory: infra/aws
        shell: bash
        run: |
          set -euo pipefail
          terraform init -backend=false
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
          terraform plan -detailed-exitcode

          BACKUP_BUCKET="$(terraform output -raw backup_bucket_name)"
          echo "BACKUP_BUCKET=${BACKUP_BUCKET}" >> "$GITHUB_ENV"

      - name: Layer 4 — Test db-backup.sh and db-restore.sh against emulated S3 + Postgres
        shell: bash
        env:
          DATABASE_URL: "postgresql://ftth:ftth_emulator_password@127.0.0.1:5432/ftth_copilot"
        run: |
          set -euo pipefail

          psql "$DATABASE_URL" -c "CREATE TABLE IF NOT EXISTS backup_smoke_test (id INT PRIMARY KEY, label TEXT);"
          psql "$DATABASE_URL" -c "INSERT INTO backup_smoke_test (id, label) VALUES (1, 'synthetic-ok') ON CONFLICT (id) DO NOTHING;"

          ./scripts/db-backup.sh --remote "s3://${BACKUP_BUCKET}/ci-smoke"

          LATEST_KEY="$(aws s3 ls "s3://${BACKUP_BUCKET}/ci-smoke/" | awk '{print $4}' | tail -n 1)"
          test -n "$LATEST_KEY"
          aws s3 cp "s3://${BACKUP_BUCKET}/ci-smoke/${LATEST_KEY}" "/tmp/${LATEST_KEY}"

          psql "$DATABASE_URL" -c "DROP TABLE backup_smoke_test;"
          echo "yes" | ./scripts/db-restore.sh "/tmp/${LATEST_KEY}"

          RESTORED="$(psql "$DATABASE_URL" -tAc "SELECT label FROM backup_smoke_test WHERE id = 1;")"
          test "$RESTORED" = "synthetic-ok"

      - name: Terraform destroy against AWS Emulator
        if: always() && steps.apply.outcome == 'success'
        working-directory: infra/aws
        shell: bash
        run: |
          set -euo pipefail
          terraform destroy -auto-approve

      - name: Dump AWS Emulator logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== AWS Emulator Log ==="
          tail -n 200 /tmp/aws-emulator.log || true

name: Terraform AWS Reference

on:
  push:
    branches: [main]
    paths:
      - "infra/aws/**"
      - "scripts/db-backup.sh"
      - "scripts/db-restore.sh"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/aws/**"
      - "scripts/db-backup.sh"
      - "scripts/db-restore.sh"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TERRAFORM_VERSION: "1.17.2"
  TFLINT_VERSION: "0.66.0"
  TRIVY_VERSION: "0.60.0"

jobs:
  static-and-mock-tests:
    name: Layer 1-2 — Static Checks & Mocked Terraform Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform, TFLint, and Trivy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
          unzip -qo /tmp/terraform.zip -d /usr/local/bin
          rm -f /tmp/terraform.zip

          curl -fsSL "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" -o /tmp/tflint.zip
          unzip -qo /tmp/tflint.zip -d /usr/local/bin
          rm -f /tmp/tflint.zip

          docker pull "aquasec/trivy:${TRIVY_VERSION}"

          terraform version
          tflint --version
          docker run --rm "aquasec/trivy:${TRIVY_VERSION}" --version

      - name: Terraform fmt check
        working-directory: infra/aws
        run: terraform fmt -check -recursive

      - name: Terraform init & validate
        working-directory: infra/aws
        run: |
          terraform init -backend=false
          terraform validate

      - name: TFLint check
        working-directory: infra/aws
        run: |
          tflint --init
          tflint --recursive

      - name: Trivy IaC security scan
        working-directory: infra/aws
        run: docker run --rm -v "$PWD:/src" -w /src "aquasec/trivy:${TRIVY_VERSION}" config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs tests --ignorefile .trivyignore.yaml .

      - name: Layer 2 — Terraform native unit tests (mocked providers)
        working-directory: infra/aws
        run: terraform test

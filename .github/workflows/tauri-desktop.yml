name: Build Tauri Desktop

on:
  push:
    branches:
      - main
      - tauri-desktop
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/web/src-tauri/**'
      - '.github/workflows/tauri-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.deb + AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://demo.ftth-copilot.com' }}
      NEXT_PUBLIC_PLATFORM: 'tauri'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/web/src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        working-directory: apps/web
        run: pnpm build

      - name: Prepare Tauri webview entrypoint
        working-directory: apps/web
        run: pnpm tauri:prepare

      - name: Build Tauri (Linux)
        working-directory: apps/web
        run: pnpm exec tauri build --bundles deb,appimage

      - name: Locate artifacts (Linux)
        working-directory: apps/web
        run: |
          echo "=== Bundles ==="
          find src-tauri/target/release/bundle -type f 2>/dev/null || true
        shell: bash

      - name: Upload Linux .deb
        uses: actions/upload-artifact@v4
        with:
          name: ftth-copilot-linux-deb
          path: apps/web/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ftth-copilot-linux-appimage
          path: apps/web/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 30

  build-windows:
    name: Build Windows (MSI + NSIS)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://demo.ftth-copilot.com' }}
      NEXT_PUBLIC_PLATFORM: 'tauri'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/web/src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        working-directory: apps/web
        run: pnpm build

      - name: Prepare Tauri webview entrypoint
        working-directory: apps/web
        run: pnpm tauri:prepare

      - name: Build Tauri (Windows)
        working-directory: apps/web
        run: pnpm exec tauri build --bundles nsis,msi

      - name: Locate artifacts (Windows)
        working-directory: apps/web
        run: |
          echo "=== Bundles ==="
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
        shell: pwsh

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: ftth-copilot-windows-msi
          path: apps/web/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        with:
          name: ftth-copilot-windows-nsis
          path: apps/web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30

  attach-to-release:
    name: Attach to GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true

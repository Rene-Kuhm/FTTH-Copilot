name: Build Tauri Desktop

# ──────────────────────────────────────────────────────────────────────
# Build de VALIDACIÓN: compila los instaladores para comprobar que el
# código compila en Linux y en Windows.
#
# No llama a `build-desktop.yml`: ese workflow reutilizable pide
# `id-token: write` y `attestations: write` para atestar la procedencia
# (SLSA L3), y GitHub valida el grafo del run antes de crear ningún job:
# si el caller no concede esos scopes, el run entero muere con
# `startup_failure` y cero jobs.
#
# Los pasos de compilación viven en la acción compuesta
# `.github/actions/desktop-build`, que es la misma que usa el builder de
# release: las dos rutas compilan exactamente lo mismo, y sólo la de
# release atesta.
#
# Permisos: `contents: read` y nada más. Un pull request no puede pedir
# un token OIDC ni atestar nada.
# ──────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - tauri-desktop
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/web/src-tauri/**'
      - '.github/workflows/tauri-desktop.yml'
      - '.github/actions/desktop-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux (.deb + AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      # La versión de mise está fijada: usa el mismo toolchain exacto que
      # el CI y que el entorno local (mise.lock).
      MISE_VERSION: "2026.10.12"
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://demo.ftth-copilot.com' }}
      NEXT_PUBLIC_PLATFORM: 'tauri'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the installers
        uses: ./.github/actions/desktop-build
        with:
          mise-version: ${{ env.MISE_VERSION }}
          bundles: deb,appimage

      - name: Locate artifacts (Linux)
        working-directory: apps/web
        run: |
          echo "=== Bundles ==="
          find src-tauri/target/release/bundle -type f 2>/dev/null || true
        shell: bash

      - name: Upload Linux .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ftth-copilot-desktop-linux-deb
          path: apps/web/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ftth-copilot-desktop-linux-appimage
          path: apps/web/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 30

  build-windows:
    name: Build Windows (MSI + NSIS)
    runs-on: windows-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      MISE_VERSION: "2026.10.12"
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://demo.ftth-copilot.com' }}
      NEXT_PUBLIC_PLATFORM: 'tauri'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the installers
        uses: ./.github/actions/desktop-build
        with:
          mise-version: ${{ env.MISE_VERSION }}
          bundles: nsis,msi

      - name: Locate artifacts (Windows)
        working-directory: apps/web
        run: |
          echo "=== Bundles ==="
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
        shell: pwsh

      - name: Upload Windows MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ftth-copilot-desktop-windows-msi
          path: apps/web/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ftth-copilot-desktop-windows-nsis
          path: apps/web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30

name: Android APK Build

# ──────────────────────────────────────────────────────────────────────
# Workflow REUTILIZABLE: es el builder de los APK de Android.
#
# Misma receta de SLSA v1.0 Build Level 3 que en `build-desktop.yml`: los
# pasos de compilación y de atestación están en el workflow reutilizable, y
# el caller (`release.yml`) sólo puede pasarle el tag, no inyectar pasos en
# el build. Eso es lo que da el aislamiento del nivel 3.
#
# Lo invocan:
#   - android-apk.yml → build de validación (PR / push). Sin atestación.
#   - release.yml     → build de release (tag v*): compila, atesta la
#     procedencia (SLSA L3) y atesta el SBOM contra los mismos bytes.
#
# PERMISOS: este workflow pide `id-token: write` y `attestations: write`
# porque atesta. Eso obliga a que TODO caller conceda esos scopes: GitHub
# valida el grafo del run antes de crear ningún job y rechaza el run entero
# con `startup_failure` si el caller no los concede. El `if:` del job no
# protege, porque la validación mira lo declarado y no si el job corre.
#
# Por eso la validación NO llama a este workflow: usa la acción compuesta
# `.github/actions/android-build`, que tiene los mismos pasos de compilación
# sin pedir permisos elevados. La regla `caller-permissions` de
# `scripts/lib/supply-chain.ts` es la que verifica esta relación.
# ──────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      release-tag:
        description:
          'Tag de la release a construir y atestar (por ejemplo v1.2.3).
          Vacío = build de validación: no atesta, no publica.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write

    env:
      # La versión de mise está fijada: el build de release usa el mismo
      # toolchain exacto que el CI y que el entorno local (mise.lock).
      MISE_VERSION: "2026.10.12"
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag }}

      # ────────────────────────────────────────────────────────────
      # SBOM SPDX del árbol que se va a compilar. Va antes de instalar y
      # compilar a propósito: con `node_modules` o artefactos de build en el
      # workspace, Syft los catalogaría y el SBOM dejaría de ser
      # reproducible.
      # ────────────────────────────────────────────────────────────
      - name: Generate the SPDX SBOM
        if: inputs.release-tag != ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      # ────────────────────────────────────────────────────────────
      # Canonicalización del SBOM (mismo criterio que en
      # `build-desktop.yml`): sin el UUID aleatorio, la hora de
      # creación ni el inventario de archivos, el digest es idéntico en
      # todas las legs y coincide con el `sbom.spdx.json` que adjunta
      # `release-please.yml` a la release.
      # ────────────────────────────────────────────────────────────
      - name: Normalize the SBOM for a reproducible digest
        if: inputs.release-tag != ''
        env:
          TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          created="$(date -u -d "@$(git log -1 --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)"
          jq -S \
            --arg namespace "https://ftth-copilot.dev/spdx/v1/${TAG}" \
            --arg created "${created}" \
            --arg name "${TAG}" \
            '.documentNamespace = $namespace
             | .creationInfo.created = $created
             | .name = $name
             | del(.files)
             | .relationships = [
                 .relationships[]
                 | select(((.relatedSpdxElement // "") | test("SPDXRef-File-")) | not)
                 | select(((.spdxElementId // "") | test("SPDXRef-File-")) | not)
               ]' \
            sbom.spdx.json > sbom.normalized.json
          mv sbom.normalized.json sbom.spdx.json

      # ────────────────────────────────────────────────────────────
      # Los pasos de compilación viven en una acción compuesta para que
      # el camino de validación compile exactamente lo mismo sin heredar
      # los permisos de atestación. Ver `.github/actions/android-build`.
      # ────────────────────────────────────────────────────────────
      - name: Build the APKs
        uses: ./.github/actions/android-build
        with:
          mise-version: ${{ env.MISE_VERSION }}

      - name: Locate APK files
        run: |
          echo "=== APKs ==="
          find . -name "*.apk" -type f

      # ────────────────────────────────────────────────────────────
      # Procedencia SLSA Build L3, emitida por este workflow sobre los
      # APK recién compilados. Sin claves: la identidad del builder sale
      # del token OIDC del runner.
      # ────────────────────────────────────────────────────────────
      - name: Attest build provenance (keyless Sigstore)
        if: inputs.release-tag != ''
        id: attest-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apps/web/android/app/build/outputs/apk/debug/app-debug.apk
            apps/web/android/app/build/outputs/apk/release/app-release-unsigned.apk

      # ────────────────────────────────────────────────────────────
      # El SBOM atestado: liga el inventario de dependencias al digest
      # exacto de cada APK.
      #
      # `actions/attest-sbom` es la acción que pide el issue; desde v4
      # delega internamente en `actions/attest` (y avisa por log que
      # está deprecada, pero sigue siendo la forma de atestar un SBOM
      # con la sintaxis de `subject-path` + `sbom-path`).
      # ────────────────────────────────────────────────────────────
      - name: Attest the SPDX SBOM
        if: inputs.release-tag != ''
        id: attest-sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            apps/web/android/app/build/outputs/apk/debug/app-debug.apk
            apps/web/android/app/build/outputs/apk/release/app-release-unsigned.apk
          sbom-path: sbom.spdx.json

      - name: Collect the attestation bundles
        if: inputs.release-tag != ''
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p attestations
          for bundle in "provenance:${PROVENANCE_BUNDLE}" "sbom:${SBOM_BUNDLE}"; do
            name="${bundle%%:*}"
            path="${bundle#*:}"
            if [ -n "${path}" ] && [ -f "${path}" ]; then
              cp "${path}" "attestations/${name}-android.jsonl"
            else
              echo "::warning::No bundle produced for ${name}."
            fi
          done
          cp sbom.spdx.json attestations/sbom.spdx.json

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ftth-copilot-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ftth-copilot-android-release
          path: apps/web/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the attestation bundles
        if: inputs.release-tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestations-android
          path: attestations/
          if-no-files-found: warn
          retention-days: 90

  attach-to-release:
    name: Attach to GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: inputs.release-tag != ''
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: 'ftth-copilot-android-*'

      - name: Attach APKs to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true

name: UI Quality

# Accesibilidad (axe), regresión visual (capturas) y compatibilidad entre
# navegadores y dispositivos (Chromium, Firefox y WebKit) de apps/web.
#
# Corre dentro de la imagen oficial de Playwright, no en el runner pelado:
#   - trae las bibliotecas del sistema que WebKit necesita (en un Linux sin
#     ellas, `playwright install webkit` falla);
#   - fija las fuentes del sistema, de las que dependen las capturas. Las
#     referencias de e2e/visual/screens.spec.ts-snapshots se generan en esta
#     misma imagen (ver docs/testing-a11y-visual-regression.md), no en el
#     equipo de quien desarrolla.
#
# Es un check aparte de `ci.yml`: no forma parte del gate `CI Success` hasta
# que demuestre que es estable. Las APIs están simuladas, no necesita
# PostgreSQL ni ningún servicio.

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ui-quality.yml"
  workflow_dispatch:

concurrency:
  group: ui-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_VERSION: "2026.10.12"

jobs:
  ui-quality:
    name: UI quality (a11y, visual, compat)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      # La versión de la imagen tiene que coincidir con @playwright/test del
      # lockfile: así los navegadores ya vienen instalados.
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      # Valores de prueba: ninguna llamada llega a una base de datos real.
      DATABASE_URL: postgresql://ftth:ftth@127.0.0.1:5432/ftth_copilot_e2e
      JWT_SECRET: e2e-jwt-secret-for-playwright-only
      KMS_MASTER_KEY: e2e-kms-master-key-for-playwright-only
      ENABLE_TEST_AUTH_BYPASS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (Node + pnpm con versiones exactas)
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm --filter @ftth-copilot/web build:e2e

      # Si la imagen y el lockfile se desfasan, esto descarga los navegadores
      # correctos; si coinciden, no hace nada.
      - name: Ensure browsers match the installed Playwright
        run: pnpm --filter @ftth-copilot/web exec playwright install chromium firefox webkit

      - name: Accessibility (axe)
        run: pnpm --filter @ftth-copilot/web test:a11y

      - name: Visual regression
        run: pnpm --filter @ftth-copilot/web test:visual

      - name: Cross-browser and cross-device matrix
        run: pnpm --filter @ftth-copilot/web test:e2e:compat

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-quality-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

name: Build Android APK

on:
  push:
    branches:
      - main
      - design-system-v1
      - capacitor-android
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/web/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js static export
        working-directory: apps/web
        env:
          NEXT_OUTPUT_MODE: export
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://demo.ftth-copilot.com' }}
          NEXT_PUBLIC_PLATFORM: 'capacitor'
        run: pnpm build:static

      - name: Capacitor sync
        working-directory: apps/web
        run: pnpm cap:sync

      - name: Make gradlew executable
        working-directory: apps/web/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        working-directory: apps/web/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK files
        working-directory: apps/web/android
        run: |
          echo "=== APKs ==="
          find . -name "*.apk" -type f

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ftth-copilot-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ftth-copilot-release
          path: apps/web/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/web/android/app/build/outputs/apk/debug/app-debug.apk
            apps/web/android/app/build/outputs/apk/release/app-release-unsigned.apk
          fail_on_unmatched_files: false
          generate_release_notes: true

name: Build Android APK

# ──────────────────────────────────────────────────────────────────────
# Build de VALIDACIÓN: compila los APK para comprobar que el código
# compila con el SDK de Android.
#
# Los pasos de compilación no viven acá: viven en el workflow reutilizable
# `build-android.yml`, que es el "builder" que emite la procedencia
# SLSA v1.0 Build Level 3 cuando el build es de release. Este workflow es
# el caller: decide qué se construye y qué permisos se conceden.
#
# En validación no se atesta nada: este caller concede `contents: read`
# (sin `id-token: write` ni `attestations: write`) y los pasos de
# atestación del builder están condicionados al modo release. Un pull
# request de un fork no llega ni a pedir un token OIDC.
#
# El build de release lo dispara `release.yml`, que `release-please.yml`
# despacha cuando publica la release (ver §9.4 de
# `docs/reference/contenedores-y-ci.md`): llama al mismo workflow
# reutilizable pasando el tag.
# ──────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - design-system-v1
      - capacitor-android
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/web/android/**'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    uses: ./.github/workflows/build-android.yml
    permissions:
      contents: read

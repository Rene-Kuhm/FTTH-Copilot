# FTTH-Copilot — Development Docker Compose (postgres only)
# For a full demo with synthetic data and demo account, use:
#   ./scripts/run-demo.sh
#   # or: cp docs/demo-env-template.md .env && docker compose -f docker-compose.demo.yml up
---
services:
  postgres:
    image: postgres:16-alpine
    container_name: ftth_copilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ftth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ftth_copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ftth} -d ${POSTGRES_DB:-ftth_copilot}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

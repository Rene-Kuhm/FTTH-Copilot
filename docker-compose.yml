# FTTH-Copilot — Development Docker Compose
# For a full demo with synthetic data and demo account, use:
#   ./scripts/run-demo.sh
#   # or: cp docs/demo-env-template.md .env && docker compose -f docker-compose.demo.yml up
#
# For observability (metrics, dashboards), use docker-compose.demo.yml or
# docker-compose.prod.yml which include the VictoriaMetrics service.
# This base compose provides postgres + redis + optional laya only.
---
services:
  postgres:
    image: postgres:16-alpine
    container_name: ftth_copilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ftth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ftth_copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ftth} -d ${POSTGRES_DB:-ftth_copilot}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────────────────────────────────
  # Redis — durable job queue for the background worker.
  #
  # Self-hosted on purpose: no managed broker, no SaaS (see the project's
  # non-goals). Append-only persistence is on because the queue holds the
  # ingest backlog: a job that was accepted and not yet drained must
  # survive a Redis restart, otherwise a trap is lost.
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:8.10.2-alpine
    container_name: ftth_copilot_redis
    restart: unless-stopped
    environment:
      # The healthcheck authenticates with it.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # The queue holds the ingest backlog and the worker reaches Redis
      # through the host. A published port does NOT go through the host
      # firewall, so Redis must never be reachable without a password.
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      # Only the loopback: the worker runs on the host network and reaches
      # Redis there.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # It authenticates: a bare `redis-cli ping` gets NOAUTH and still
      # exits 0, so it would report a healthy Redis that nobody can use.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────
  # Worker — background job runner (backend extraction).
  #
  # Owns the polling, firmware audit, FEC collection, syslog/SNMP reception
  # and the event drainer. It is behind a profile on purpose: while
  # BACKEND_MODE=embedded (the default) the web still runs those loops, and
  # running both would poll the NMS twice and double-bind the UDP socket.
  # Deploy it only with BACKEND_MODE=worker:
  #   docker compose --profile worker up
  #
  # It uses the host network on purpose. The syslog receiver is attributed by
  # the source IP of the datagram, and Docker's userland proxy for UDP
  # rewrites that address to the bridge gateway: every OLT would look like
  # the same source, and the brute-force detectors would merge distinct
  # attacks into one. With the host network the kernel delivers the datagram
  # with the real source address.
  #
  # Consequence: the worker reaches Postgres and Redis through the ports the
  # host publishes, not through the compose network.
  # ─────────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: ftth_copilot_worker
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@127.0.0.1:${REDIS_PORT:-6379}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ftth}:${POSTGRES_PASSWORD:-change-me}@127.0.0.1:${POSTGRES_PORT:-5432}/ftth_copilot"
      # The spool must survive a restart: it holds the events that were
      # received but not yet written to Postgres.
      EVENT_SPOOL_DIR: /var/lib/ftth-copilot/spool/worker
      # The health server stays on the loopback: with the host network it
      # would otherwise listen on every public interface of the server.
      WORKER_HOST: 127.0.0.1
      WORKER_PORT: "8081"
      NODE_ENV: production
    volumes:
      - spool_data:/var/lib/ftth-copilot/spool
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - worker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────
  # Laya Decision Layer — Fast Decision System (ADR-042)
  # Expert System (94.4% accuracy) — runs as microservice fallback.
  # Primary mode is module import from @ftth-copilot/shared.
  # Enable via: LAYA_ENABLED=true LAYA_MODE=shadow
  # ─────────────────────────────────────────────────────────────────────
  laya:
    build:
      context: ./services/laya
      dockerfile: Dockerfile
    container_name: ftth_copilot_laya
    restart: unless-stopped
    environment:
      # Laya operating mode (shadow|assisted|automatic|disabled)
      LAYA_MODE: ${LAYA_MODE:-shadow}
      # Logging level
      LAYA_LOG_LEVEL: ${LAYA_LOG_LEVEL:-info}
    ports:
      - "${LAYA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    profiles:
      - laya  # docker compose --profile laya

volumes:
  postgres_data:
  redis_data:
  # Buffered syslog/SNMP events awaiting a write to Postgres. Losing this
  # volume loses telemetry.
  spool_data:

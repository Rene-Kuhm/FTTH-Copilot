; FTTH-Copilot — PgBouncer configuration
; Session pooling mode: required for Prisma (uses prepared statements + LISTEN/NOTIFY).
; For higher throughput at scale, consider transaction pooling after verifying Prisma
; compatibility: https://www.prisma.io/docs/guides/performance-and-optimization/connection-management#do-prisma-and-pgbouncer-work-together
;
; Usage: Start this before the app, point DATABASE_URL at pgbouncer:6432.
;
; PgBouncer does not accept inline comments: a `;` after a value is read as
; part of the value and the config fails to load. Every comment here is on
; its own line.

[databases]
ftth_copilot = host=postgres port=5432 dbname=ftth_copilot

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; ─── Pool sizing ────────────────────────────────────────────────────────────
; pool_mode = session  — required for Prisma (prepared stmts + LISTEN/NOTIFY)
pool_mode = session
max_client_conn = 500
; Backend connections per user/database.
default_pool_size = 20
min_pool_size = 5
; Burst connections above pool_size.
reserve_pool_size = 5
; Seconds before releasing a reserve connection.
reserve_pool_timeout = 3.0
; Cap connections per database (protects postgres).
max_db_connections = 100

; ─── Timeouts ───────────────────────────────────────────────────────────────
server_connect_timeout = 15
server_login_retry = 3
; Recycle backend connections after 1h.
server_lifetime = 3600
; Close idle backend connections after 10m.
server_idle_timeout = 600
; Fail fast if the pool is exhausted.
query_wait_timeout = 60
; Abort long-running queries.
query_timeout = 300

; ─── Logging ───────────────────────────────────────────────────────────────
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
; Log stats every minute.
stats_period = 60

; ─── Health ─────────────────────────────────────────────────────────────────
admin_users = postgres

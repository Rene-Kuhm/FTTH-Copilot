; FTTH-Copilot — PgBouncer configuration
; Session pooling mode: required for Prisma (uses prepared statements + LISTEN/NOTIFY).
; For higher throughput at scale, consider transaction pooling after verifying Prisma
; compatibility: https://www.prisma.io/docs/guides/performance-and-optimization/connection-management#do-prisma-and-pgbouncer-work-together
;
; Usage: Start this before the app, point DATABASE_URL at pgbouncer:6432.

[databases]
ftth_copilot = host=postgres port=5432 dbname=ftth_copilot

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; ─── Pool sizing ────────────────────────────────────────────────────────────
; pool_mode = session  — required for Prisma (prepared stmts + LISTEN/NOTIFY)
pool_mode = session
max_client_conn = 500
default_pool_size = 20           ; backend connections per user/database
min_pool_size = 5
reserve_pool_size = 5            ; burst connections above pool_size
reserve_pool_timeout = 3.0       ; seconds before releasing a reserve connection
max_db_connections = 100         ; cap connections per database (protects postgres)
max_connections = 500            ; total pgbouncer client connections

; ─── Timeouts ───────────────────────────────────────────────────────────────
server_connect_timeout = 15s
server_login_retry = 3s
server_lifetime = 3600s          ; recycle backend connections after 1h
server_idle_timeout = 600s       ; close idle backend connections after 10m
query_wait_timeout = 60s         ; fail fast if pool is exhausted
query_timeout = 300s             ; abort long-running queries

; ─── Logging ───────────────────────────────────────────────────────────────
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60                ; log stats every minute

; ─── Health ─────────────────────────────────────────────────────────────────
admin_users = postgres

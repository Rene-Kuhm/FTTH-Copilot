# Recording and alerting rules for FTTH-Copilot on VictoriaMetrics.
#
# Loaded via `-notifier.config`. Single-node VictoriaMetrics evaluates these
# rules internally, so no Prometheus/vmalert sidecar is required.
#
# Naming:
#   record:  ftth_router_dispatch_ratio_*      derived series for dashboards
#   alert:   FTTHCopilot*                     operator-facing conditions
#
# Every expression below is written against the metric names actually exported
# by `/api/metrics` (the web) and `/metrics` (the worker). The check
# `pnpm check:observability` verifies that contract on every CI run:
#
#   curl -s http://localhost:8428/api/v1/label/__name__/values | jq '.data'
#
# Note on Laya: `ftth_laya_*` series are only emitted when the Laya Decision
# Layer records a decision (LAYA_MODE != disabled). Alerts on those series stay
# INACTIVE rather than firing when the layer is off, which is intentional.
#
# Note on the worker: the `ftth_copilot_worker_*` series only exist when the
# worker is deployed AND VictoriaMetrics is scraping it (see
# `VICTORIAMETRICS_WORKER_SCRAPE_TARGET` in docker-compose.prod.yml). The
# alerts below stay INACTIVE in a deployment without a worker, for the same
# reason: an alert that fires because a component is not deployed is an
# alert nobody reads.

groups:
  # ── Recording rules ───────────────────────────────────────────────────────
  # These pre-aggregate the router and LLM paths so dashboard queries stay cheap
  # and so alert expressions do not repeat the same sum() over a long window.
  - name: ftth-copilot-recording
    interval: 30s
    rules:
      # Share of dispatches resolved by each router mode over 15m.
      # The router's whole point is that cheap modes should dominate; a rising
      # investigation share is the signal that the cheap paths stopped working.
      - record: ftth_router_dispatch_ratio:mode15m
        expr: |
          sum by (mode) (increase(ftth_copilot_router_dispatches_total[15m]))
            / clamp_min(sum(increase(ftth_copilot_router_dispatches_total[15m])), 1)

      # Total dispatches per hour, any mode.
      - record: ftth_router_dispatches:rate1h
        expr: sum(increase(ftth_copilot_router_dispatches_total[1h]))

      # LLM request rate per provider and outcome.
      - record: ftth_llm_requests:rate5m
        expr: sum by (provider, status) (increase(ftth_copilot_llm_requests_total[5m]))

      # Mean LLM latency per provider over 15m.
      # The app exports histogram-style counters as _total (sum of durations)
      # and _count (number of observations), so the ratio is the average.
      # Use histogram_quantile on le buckets for p95 once the app emits them.
      - record: ftth_llm_latency_seconds:avg15m
        expr: |
          sum by (provider) (rate(ftth_copilot_llm_latency_seconds_total[15m]))
            / clamp_min(sum by (provider) (rate(ftth_copilot_llm_latency_seconds_count[15m])), 1)

      # LLM provider fallback pressure: how often the chain degraded to a
      # backup provider. A sustained non-zero rate means the primary key is
      # failing, which is a cost and latency problem before it is an outage.
      - record: ftth_llm_fallback:rate15m
        expr: sum by (primary, fallback) (increase(ftth_copilot_llm_fallback_events_total[15m]))

      # SNMP ingestion outcomes over 15m. A rising drop count means the token
      # bucket or dedup window is rejecting real traps.
      - record: ftth_snmp_traps:rate15m
        expr: sum by (status) (increase(ftth_copilot_snmp_traps_total[15m]))

      # Active operational load: alerts and incidents.
      - record: ftth_ops_active:alerts
        expr: sum by (severity) (ftth_copilot_active_alerts)

      - record: ftth_ops_active:incidents
        expr: sum(ftth_copilot_active_incidents)

  # ── Alerting rules ────────────────────────────────────────────────────────
  - name: ftth-copilot-alerts
    interval: 30s
    rules:
      # The app stopped answering scrapes. This is the most important rule:
      # every other alert below is meaningless while the target is down.
      - alert: FTTHCopilotMetricsTargetDown
        expr: up{job="ftth-copilot-app"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "FTTH-Copilot /api/metrics is not being scraped"
          description: >-
            VictoriaMetrics has failed to scrape the app for 2 minutes.
            Observability data is stale; diagnosis is unaffected.

      - alert: FTTHCopilotProcessRestarting
        expr: resets(ftth_copilot_process_uptime_seconds[30m]) > 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "FTTH-Copilot process restarted more than twice in 30m"
          description: >-
            Uptime counter reset repeatedly. Check container logs and the
            deploy history for a crash loop.

      # The primary LLM provider is failing over to the backup provider.
      - alert: FTTHCopilotLLMFallbackSustained
        expr: sum(increase(ftth_copilot_llm_fallback_events_total[15m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM provider chain is falling back repeatedly"
          description: >-
            More than 5 fallbacks in 15 minutes. The primary provider is likely
            rate-limited or erroring. Expect higher latency and cost.

      - alert: FTTHCopilotLLMErrors
        expr: sum(increase(ftth_copilot_llm_requests_total{status!="ok"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FTTH-Copilot is recording failed LLM requests"
          description: >-
            Non-ok LLM request outcomes over 10 minutes. Inspect
            ftth_copilot_llm_requests_total by status and provider.

      # Cheap router paths should carry most of the load. If investigation
      # dominates, either the intent classifier regressed or tenants are asking
      # broader questions than the direct tools can answer.
      - alert: FTTHCopilotRouterInvestigationDominant
        expr: |
          (
            sum(increase(ftth_copilot_router_dispatches_total{mode="investigation"}[30m]))
            / clamp_min(sum(increase(ftth_copilot_router_dispatches_total[30m])), 1)
          ) > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Organic Diagnostic Router is routing >80% to investigation"
          description: >-
            The direct and assisted paths should absorb routine questions. A
            sustained high investigation share raises LLM cost and latency;
            review intent classification and the single-device tool coverage.

      - alert: FTTHCopilotSNMPTrapsDropped
        expr: sum(increase(ftth_copilot_snmp_traps_total{status="dropped"}[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SNMP traps are being dropped"
          description: >-
            Non-zero dropped traps over 15 minutes. The token bucket or dedup
            window is shedding load, so OLT events are being lost before the
            detection pipeline sees them.

      - alert: FTTHCopilotActiveIncidentsHigh
        expr: sum(ftth_copilot_active_incidents) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 10 active NOC incidents"
          description: >-
            Sustained incident count above 10. Confirm whether this reflects a
            real network event or a detector/calibration problem.

  # ── The background worker ─────────────────────────────────────────────────
  # The worker owns the queues, the syslog and SNMP sockets and the durable
  # spool. These rules cover the four things that S18 asks to be observable:
  # the depth of the queues, the latency of the jobs, the retries and the
  # dead-letters.
  - name: ftth-copilot-worker
    interval: 30s
    rules:
      # The worker is up but its Redis is not: it cannot consume anything, so
      # the monitoring is blind even though the process is alive.
      - alert: FTTHCopilotWorkerRedisUnreachable
        expr: ftth_copilot_worker_redis_ready == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The worker cannot reach Redis"
          description: >-
            The worker process is alive but its Redis connection is not
            established. No queue is being consumed: the monitoring is
            stopped even though nothing failed loudly.

      # The worker's metrics are not being scraped. Every other rule of this
      # group is meaningless while the target is down.
      - alert: FTTHCopilotWorkerMetricsTargetDown
        expr: up{job="ftth-copilot-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The worker metrics are not being scraped"
          description: >-
            VictoriaMetrics has failed to scrape the worker for 2 minutes.
            The state of the queues is unknown.

      # Work is piling up in a queue. The worker is alive but it does not
      # keep up: the backlog of a poll or of an ingest grows without bound.
      - alert: FTTHCopilotWorkerQueueBacklog
        expr: ftth_copilot_worker_queue_depth > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A queue of the worker is not being drained"
          description: >-
            More than 50 jobs pending in the same queue for 15 minutes. The
            worker is not keeping up with that queue: check its latency and
            whether its Redis connection is healthy.

      # The jobs are failing. This is the first symptom of a handler that
      # broke, or of a dependency that went away.
      - alert: FTTHCopilotWorkerJobsFailing
        expr: sum(increase(ftth_copilot_worker_jobs_failed_total[15m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The worker is failing jobs"
          description: >-
            More than 5 failed jobs in 15 minutes. Inspect
            ftth_copilot_worker_jobs_failed_total by queue and the worker
            logs.

      # The jobs are being retried. Retries hide a failure: the work
      # eventually succeeds, but it is paying the cost of the attempts.
      - alert: FTTHCopilotWorkerRetriesSustained
        expr: sum(increase(ftth_copilot_worker_jobs_retried_total[15m])) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The worker is retrying jobs over and over"
          description: >-
            More than 10 retried attempts in 15 minutes. The work is
            eventually succeeding, but something is flaky: a dependency, the
            database or the network.

      # The jobs are slow. The p95 over the whole fleet, because the slow
      # queue is the one that matters and the alert has to name it.
      - alert: FTTHCopilotWorkerJobLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(ftth_copilot_worker_job_duration_seconds_bucket[15m]))
          ) > 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The jobs of the worker take more than a minute"
          description: >-
            The p95 of the job duration is above 60 seconds for 15 minutes.
            The background work is falling behind its own schedule.

      # Telemetry is being lost. The dead-letter of the ingest path holds
      # the events that could not be stored; they are recoverable with
      # `pnpm replay:dead-letter`, but only if somebody looks.
      - alert: FTTHCopilotWorkerIngestDeadLettered
        expr: increase(ftth_copilot_worker_ingest_dead_lettered_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Events are going to the dead-letter"
          description: >-
            Events that could not be stored went to the dead-letter file in
            the last 15 minutes. Recover them with
            `pnpm replay:dead-letter` and find out why the store refused
            them.

      # The spool refused events because it reached its size limit, or the
      # receiver discarded them because of its rate limit. Unlike the
      # dead-letter, these are gone.
      - alert: FTTHCopilotWorkerIngestEventsLost
        expr: |
          sum(increase(ftth_copilot_worker_ingest_dropped_total[15m]))
            + sum(increase(ftth_copilot_worker_ingest_rate_limited_total[15m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The ingest path is losing events"
          description: >-
            Events were dropped by the size limit of the spool or discarded
            by the rate limit of the receiver. Unlike the dead-letter, these
            are not recoverable.

# Curated Semgrep ruleset for FTTH-Copilot (TypeScript / Next.js / Node / Docker)
# Usage: `pnpm security:sast:semgrep` (or via `pnpm security:sast` when semgrep is available).

rules:
  - id: ftth-ts-eval-or-new-function
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
    message: Dynamic code evaluation via eval() or new Function() is forbidden.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-95"
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/.next/**"
        - "**/dist/**"
        - "**/coverage/**"
        - "/packages/db/src/generated/**"

  - id: ftth-ts-child-process-shell
    patterns:
      - pattern-either:
          - pattern: child_process.exec($CMD, ...)
          - pattern: child_process.execSync($CMD, ...)
          - pattern: 'spawn($CMD, $ARGS, { ..., shell: true, ... })'
          - pattern: 'spawnSync($CMD, $ARGS, { ..., shell: true, ... })'
    message: Avoid shell-invoking child_process calls; use execFile/spawn without shell=true.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-78"
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/.next/**"
        - "**/dist/**"
        - "**/coverage/**"
        - "/packages/db/src/generated/**"

  - id: ftth-ts-weak-hash-algorithm
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("md5")
          - pattern: crypto.createHash("sha1")
          - pattern: createHash("md5")
          - pattern: createHash("sha1")
    message: Weak hash algorithm (MD5/SHA1) in createHash(); use SHA-256 or stronger.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A02:2021 - Cryptographic Failures"
      cwe: "CWE-328"
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/.next/**"
        - "**/dist/**"
        - "**/coverage/**"
        - "/packages/db/src/generated/**"

  - id: ftth-ts-jwt-decode-without-verify
    patterns:
      - pattern-either:
          - pattern: jwt.decode(...)
          - pattern: jsonwebtoken.decode(...)
    message: jwt.decode() does not verify signatures; use jwt.verify() with explicit algorithms.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A07:2021 - Identification and Authentication Failures"
      cwe: "CWE-347"
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/.next/**"
        - "**/dist/**"
        - "**/coverage/**"
        - "/packages/db/src/generated/**"

  - id: ftth-ts-jwt-alg-none
    patterns:
      - pattern-either:
          - pattern: "{ algorithms: [..., \"none\", ...] }"
          - pattern: "{ algorithm: \"none\" }"
    message: JWT 'none' algorithm is forbidden.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A07:2021 - Identification and Authentication Failures"
      cwe: "CWE-327"
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/.next/**"
        - "**/dist/**"
        - "**/coverage/**"
        - "/packages/db/src/generated/**"

  - id: ftth-ts-tls-reject-unauthorized-false
    patterns:
      - pattern-either:
          - pattern: "{ rejectUnauthorized: false }"
          - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
    message: Disabling TLS certificate verification is forbidden.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A02:2021 - Cryptographic Failures"
      cwe: "CWE-295"
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/.next/**"
        - "**/dist/**"
        - "**/coverage/**"
        - "/packages/db/src/generated/**"

  - id: ftth-ts-prisma-raw-unsafe
    patterns:
      - pattern-either:
          - pattern: $DB.$queryRawUnsafe(...)
          - pattern: $DB.$executeRawUnsafe(...)
    message: Prisma $queryRawUnsafe / $executeRawUnsafe risks SQL injection; use tagged template $queryRaw.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-89"
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/.next/**"
        - "**/dist/**"
        - "**/coverage/**"
        - "/packages/db/src/generated/**"

  - id: ftth-ts-timing-unsafe-bearer-compare
    patterns:
      - pattern-either:
          - pattern: $TOKEN !== $BEARER
          - pattern: $TOKEN === $BEARER
          - pattern: $BEARER !== $TOKEN
          - pattern: $BEARER === $TOKEN
      - metavariable-regex:
          metavariable: $BEARER
          regex: '.*(bearerToken|apiSecret|webhookSecret|signingSecret|hmacSecret).*'
    message: Non-constant-time secret comparison enables timing side-channel attacks; use crypto.timingSafeEqual.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: security
      owasp: "A02:2021 - Cryptographic Failures"
      cwe: "CWE-208"
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/.next/**"
        - "**/dist/**"
        - "**/coverage/**"
        - "/packages/db/src/generated/**"

  - id: ftth-ts-prototype-pollution-proto
    patterns:
      - pattern-either:
          - pattern: $OBJ.__proto__
          - pattern: "{ __proto__: ... }"
    message: Direct __proto__ reference is a prototype pollution risk.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A08:2021 - Software and Data Integrity Failures"
      cwe: "CWE-1321"
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/.next/**"
        - "**/dist/**"
        - "**/coverage/**"
        - "/packages/db/src/generated/**"

  - id: ftth-container-seccomp-unconfined
    pattern-regex: "(seccomp[:=]\\s*unconfined|privileged:\\s*true)"
    message: Disabling seccomp confinement or running privileged containers weakens runtime isolation.
    languages: [yaml]
    severity: WARNING
    paths:
      include:
        - "**/docker-compose*.yml"
        - "**/*.yml"
        - "**/*.yaml"
      exclude:
        - "**/node_modules/**"

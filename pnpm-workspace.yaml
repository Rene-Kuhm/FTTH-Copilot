packages:
  - "apps/*"
  - "packages/*"
  - "packages/connectors/*"
overrides:
  vite: 6.4.3
  deepmerge-ts: ">=8.0.0"
  js-yaml: ^4.3.2
  serialize-javascript: ^7.0.5
  uuid: ^11.1.1
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: false
  sharp: false
  unrs-resolver: false
  # Optional native accelerator for msgpackr (a BullMQ dependency). The pure-JS
  # fallback is used instead, matching the repo's policy for optional
  # accelerators (esbuild, sharp, unrs-resolver).
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - bullmq@6.5.3

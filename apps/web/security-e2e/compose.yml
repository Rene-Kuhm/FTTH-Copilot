# Isolated audit stack for local DAST/authz security testing.
# Synthetic credentials only; bound strictly to 127.0.0.1 on dedicated ports
# so development Postgres (5432), Redis (6379), and app (3001) are untouched.
name: ftth-sec-audit

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ftth_audit
      POSTGRES_PASSWORD: audit-synthetic
      POSTGRES_DB: ftth_copilot_security
    ports:
      - "127.0.0.1:55444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftth_audit -d ftth_copilot_security"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:16344:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

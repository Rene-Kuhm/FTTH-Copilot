[package]
name = "ftth-copilot"
version = "0.2.1"
description = "FTTH-Copilot — AI-powered FTTH network diagnostics"
authors = ["FTTH-Copilot"]
license = "UNLICENSED"
repository = "https://github.com/Rene-Kuhm/FTTH-Copilot"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"

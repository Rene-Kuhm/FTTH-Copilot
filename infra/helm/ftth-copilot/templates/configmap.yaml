apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ftth-copilot.fullname" . }}-config
  labels:
    {{- include "ftth-copilot.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  PORT: {{ .Values.web.service.targetPort | quote }}
  HOSTNAME: "0.0.0.0"
  WORKER_HOST: "0.0.0.0"
  WORKER_PORT: {{ .Values.worker.service.healthPort | quote }}
  EVENT_SPOOL_DIR: {{ printf "%s/worker" .Values.worker.persistence.mountPath | quote }}

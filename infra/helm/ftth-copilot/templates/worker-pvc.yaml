{{- if .Values.worker.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ftth-copilot.fullname" . }}-worker-spool
  labels:
    {{- include "ftth-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  accessModes:
    {{- toYaml .Values.worker.persistence.accessModes | nindent 4 }}
  {{- if .Values.worker.persistence.storageClassName }}
  storageClassName: {{ .Values.worker.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.worker.persistence.size }}
{{- end }}

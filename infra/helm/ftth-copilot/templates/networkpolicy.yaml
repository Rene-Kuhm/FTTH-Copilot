{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ftth-copilot.fullname" . }}-web
  labels:
    {{- include "ftth-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      {{- include "ftth-copilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.web.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ftth-copilot.fullname" . }}-worker
  labels:
    {{- include "ftth-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "ftth-copilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: UDP
          port: {{ .Values.worker.service.snmpPort }}
        - protocol: UDP
          port: {{ .Values.worker.service.syslogPort }}
        - protocol: TCP
          port: {{ .Values.worker.service.healthPort }}
{{- end }}

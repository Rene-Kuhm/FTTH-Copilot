{{- if not .Values.secrets.existingSecret }}
{{- $fullname := include "ftth-copilot.fullname" . -}}
{{- $pgPass := default (randAlphaNum 24) .Values.postgresql.auth.password -}}
{{- $redisPass := default (randAlphaNum 24) .Values.redis.auth.password -}}
{{- $jwtSecret := default (randAlphaNum 48) .Values.secrets.jwtSecret -}}
{{- $kmsKey := default (randAlphaNum 48) .Values.secrets.kmsMasterKey -}}
{{- $dbUrl := .Values.externalDatabase.url -}}
{{- if .Values.postgresql.enabled -}}
  {{- $dbUrl = printf "postgresql://%s:%s@%s-postgresql:%d/%s" .Values.postgresql.auth.username $pgPass $fullname (int .Values.postgresql.port) .Values.postgresql.auth.database -}}
{{- end -}}
{{- $redisUrl := .Values.externalRedis.url -}}
{{- if .Values.redis.enabled -}}
  {{- $redisUrl = printf "redis://:%s@%s-redis:%d" $redisPass $fullname (int .Values.redis.port) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ftth-copilot.secretName" . }}
  labels:
    {{- include "ftth-copilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $dbUrl | quote }}
  REDIS_URL: {{ $redisUrl | quote }}
  JWT_SECRET: {{ $jwtSecret | quote }}
  KMS_MASTER_KEY: {{ $kmsKey | quote }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  REDIS_PASSWORD: {{ $redisPass | quote }}
{{- end }}

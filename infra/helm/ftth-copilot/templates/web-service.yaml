apiVersion: v1
kind: Service
metadata:
  name: {{ include "ftth-copilot.fullname" . }}-web
  labels:
    {{- include "ftth-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ftth-copilot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web

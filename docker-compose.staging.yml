# FTTH-Copilot — staging
#
# Override de `docker-compose.prod.yml`. Se usa en conjunto:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml up -d
#
# Qué cambia respecto de producción:
#
#   - la web no publica puerto: Caddy queda delante, así la web puede
#     escalar a varias réplicas sin chocar por el puerto 3001;
#   - `BACKEND_MODE=worker`: el worker es el dueño del trabajo de fondo, que
#     es justo lo que T14 tiene que validar;
#   - el worker deja de estar detrás de un profile: en staging es el que
#     corre, y no una opción;
#   - VictoriaMetrics queda en el loopback: en una máquina pública el TSDS
#     no debería quedar al alcance de internet.
#
# Lo que NO cambia, a propósito: Redis, Postgres, el worker en la red del
# host, el spool durable y el stack de observabilidad. El staging tiene que
# ejercitar el mismo camino que producción, con los mismos límites.
#
# La decisión de dónde montarlo y con qué Redis y Postgres está en
# `docs/how-to/desplegar-en-staging.md`.
#
# El nombre del proyecto es propio: Compose genera los nombres de los
# contenedores a partir de él, así que con el mismo nombre que producción los
# dos stacks no podrían convivir en un mismo host.
name: ftth-staging

services:
  postgres:
    # El compose de producción lee `.env.prod`; en staging es `.env.staging`.
    env_file: !override [.env.staging]

  redis:
    env_file: !override [.env.staging]

  db-migrate:
    env_file: !override [.env.staging]
    environment:
      # El `db-migrate` corre en la red de Compose, así que llega a Postgres
      # por el nombre del servicio. Sin esta URL, `prisma migrate deploy`
      # no encuentra la variable `DATABASE_URL` y las migraciones no
      # corren: como la web y el worker dependen de que terminen bien, el
      # stack entero queda abajo. En producción la URL llega por
      # `env_file: .env.prod`; acá el compose la arma, para que no pueda
      # quedar con una password distinta de la de `POSTGRES_PASSWORD`.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ftth}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ftth_copilot}"

  app:
    env_file: !override [.env.staging]
    # La web no se publica: Caddy hace de reverse proxy. Con el puerto
    # publicado, `--scale app=2` no puede arrancar (la segunda réplica no
    # puede tomar el puerto).
    ports: !reset []
    expose:
      - "3001"
    environment:
      # El dueño del trabajo de fondo es el worker, no el proceso web. En
      # `embedded` la web arranca los loops, el receptor syslog, el SNMP y
      # el drainer; en `worker` no toca ninguno de ellos.
      BACKEND_MODE: worker
      # La URL se arma sola, para que no pueda quedar con una password
      # distinta de la de `POSTGRES_PASSWORD`.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ftth}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ftth_copilot}"

  worker:
    env_file: !override [.env.staging]
    # Sin profile: en staging el worker es parte del stack, no una opción.
    profiles: !override []

  victoriametrics:
    # Sólo el loopback. La UI y la API Prometheus quedan accesibles por
    # túnel SSH, no desde internet.
    ports: !reset []
    expose:
      - "8428"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${STAGING_HTTP_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    networks:
      - ftth-network

  # ─────────────────────────────────────────────────────────────────────
  # Mock NMS — el NMS contra el que polea el staging.
  #
  # El staging necesita un NMS: sin él, la conexión que crea el seed no se
  # puede consultar y los loops no tienen nada que hacer. Este sirve el mock
  # que ya está en el repo (`smartoltMockResponse`), por HTTP, para que lo
  # que se ejercita sea el conector real —el que aplica la política SSRF y
  # habla con `fetch`— y no un atajo por dentro.
  #
  # Va detrás de un profile porque un staging con un NMS real no lo tiene que
  # levantar, y porque sirve datos sintéticos: nunca en producción.
  # ─────────────────────────────────────────────────────────────────────
  mock-nms:
    image: node:22-alpine
    restart: unless-stopped
    # En la red del host, como el worker: la conexión apunta a
    # `http://127.0.0.1:${MOCK_NMS_PORT}`.
    network_mode: host
    profiles:
      - mock-nms
    command:
      - node
      - --experimental-strip-types
      - /app/mock-nms-server.ts
    environment:
      MOCK_NMS_HOST: "${MOCK_NMS_HOST:-127.0.0.1}"
      MOCK_NMS_PORT: "${MOCK_NMS_PORT:-18080}"
    volumes:
      # El servidor y el mock del repo, tal cual. El `package.json` va con
      # ellos para que node los trate como módulos ESM sin adivinar.
      - ./packages/connectors/smartolt/package.json:/app/package.json:ro
      - ./packages/connectors/smartolt/src/mock-nms.ts:/app/mock-nms.ts:ro
      - ./packages/connectors/smartolt/src/mock-nms-server.ts:/app/mock-nms-server.ts:ro
    healthcheck:
      # El mock corre en la red del host: si el puerto ya lo tiene otro
      # proceso, el contenedor muere con `EADDRINUSE` y `restart:
      # unless-stopped` lo vuelve a levantar en bucle. El healthcheck
      # convierte ese bucle en un estado visible: "unhealthy" en vez de un
      # contenedor que aparece y desaparece.
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:${MOCK_NMS_PORT:-18080}/api/system/get_olts
          | grep -q OLT-MOCK-1 || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
